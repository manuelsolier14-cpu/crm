<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM UNBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--marca:#FF7A1A;--marca2:#FF7A1A22;--ok:#16A34A;--ok2:#16A34A1F;--rd:#DC2626;--rd2:#DC26261A;--am:#D97706;--am2:#D977061F;--bl:#2563EB;--bl2:#2563EB1A;--mo:#7C3AED;--mo2:#7C3AED1A;--r:12px}
[data-tema=claro]{--bg:#F1F5F9;--p1:#FFFFFF;--p2:#FFFFFF;--p3:#F7F8FA;--bd:#E4E7EC;--bd2:#D0D5DD;--tx:#101828;--mu:#667085;--in:#FFFFFF;--burb-in:#FFFFFF;--burb-out:#DCF2FF;--burb-ia:#EDE7FF;--chatbg:#EFEAE2;--som:0 1px 2px #1018280F,0 1px 3px #1018281A}
[data-tema=oscuro]{--bg:#0B0E13;--p1:#11151C;--p2:#151A22;--p3:#1A2029;--bd:#252C37;--bd2:#323B48;--tx:#E8ECF2;--mu:#98A2B3;--in:#1A2029;--burb-in:#1C222C;--burb-out:#123A57;--burb-ia:#2A2150;--chatbg:#0E1218;--som:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:15px}
a{color:var(--bl)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--in);color:var(--tx);border:1px solid var(--bd2);border-radius:10px;padding:9px 11px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--marca);outline-offset:0;border-color:transparent}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--p1);border:1px solid var(--bd2);border-radius:10px;padding:8px 13px;min-height:38px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--p3)}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(.95)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.peligro{color:var(--rd);border-color:#DC262655}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px}
.btn.ico{padding:0;width:36px;min-height:36px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--p3);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.punto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.muted{color:var(--mu)}
.hidden{display:none!important}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--som)}
.err{color:var(--rd);font-size:13px;min-height:18px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
svg.i{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sw{position:relative;width:40px;height:22px;flex:0 0 40px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--bd2);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--marca)}
.sw input:checked+span:before{transform:translateX(18px)}
/* login */
.centro{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.caja{width:100%;max-width:390px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .u{width:36px;height:36px;border-radius:10px;background:var(--marca);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.logo b{font-weight:700;font-size:18px;letter-spacing:.2px}
/* layout */
#app{height:100%;display:flex}
#side{width:248px;flex:0 0 248px;background:#0B1220;color:#E2E8F0;display:flex;flex-direction:column;min-height:0;border-right:1px solid #1E293B}
#side .logo b{color:#fff}
#side.mini{width:72px;flex-basis:72px}#side.mini .txt,#side.mini .sec,#side.mini .n,#side.mini .flecha{display:none}#side.mini #nav button{justify-content:center}
#side .top{padding:16px 16px 10px}
#nav{flex:1;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
#nav .sec{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
#nav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:10px;padding:9px 11px;font-size:14px;font-weight:500;color:#CBD5E1;text-align:left;width:100%}
#nav button:hover{background:#1E293B;color:#fff}
#nav button.on{background:linear-gradient(90deg,var(--marca2),transparent);color:var(--marca);font-weight:600;box-shadow:inset 3px 0 0 var(--marca)}
#nav button.sub{padding-left:42px;font-size:13px}
#nav .flecha{margin-left:auto;opacity:.6}
#nav button .n{margin-left:auto;font-size:11px;background:var(--marca);color:#fff;border-radius:99px;padding:1px 7px}
#side .pie{border-top:1px solid #1E293B;padding:10px;display:flex;flex-direction:column;gap:8px}
.temas{display:flex;background:#111A2E;border-radius:10px;padding:3px;gap:3px}
.temas button{flex:1;background:none;border:0;border-radius:8px;padding:7px;color:#94A3B8;display:flex;justify-content:center}
.temas button.on{background:#1E293B;color:#fff}
#side .pie .btn.ico{background:#111A2E;border-color:#1E293B;color:#CBD5E1}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--p1);border-bottom:1px solid var(--bd)}
#topbar .busca{position:relative;flex:0 1 420px}
#topbar .busca input{padding-left:36px;background:var(--p3)}
#topbar .busca svg{position:absolute;left:11px;top:10px;color:var(--mu)}
#res-busca{position:absolute;top:44px;left:0;right:0;background:var(--p1);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 30px #0002;max-height:380px;overflow:auto;z-index:9}
#res-busca button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:10px 12px}
#res-busca button:hover{background:var(--p3)}
#app.superchat #topbar{display:none}
.avisopp{background:#FEF9C3;border:1px solid #FDE68A;color:#713F12;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
[data-tema=oscuro] .avisopp{background:#3A2E0A;border-color:#5C4813;color:#FDE68A}
.etapa-card{border-radius:14px;padding:14px;background:var(--p2);border:1px solid var(--bd);border-top:4px solid var(--c);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:120px;transition:.15s}
.etapa-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0001}
.etapa-card .t{font-weight:700;color:var(--c);font-size:13px}
.etapa-card .n{font-size:28px;font-weight:700}
.etapas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.met{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:18px;border:1px solid var(--bd);background:var(--p2)}
.met .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.met .ic svg{width:24px;height:24px}
.met .gr{font-size:30px;font-weight:700;letter-spacing:-.02em}
.gauge{position:relative;width:210px;height:115px;margin:0 auto}
.gauge svg{width:210px;height:115px}
.gauge b{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:30px;color:var(--ok)}
.seg2{display:flex;background:var(--p3);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--mu)}
.seg2 button.on{background:var(--p1);color:var(--tx);font-weight:600;box-shadow:var(--som)}
.tabs-grandes{display:flex;gap:6px;background:var(--p2);border:1px solid var(--bd);border-radius:14px;padding:6px;overflow-x:auto;flex-shrink:0}
.tabs-grandes button{flex:1;border:0;background:none;border-radius:10px;padding:11px 14px;font-weight:600;color:var(--mu);white-space:nowrap}
.tabs-grandes button.on{background:#0B1220;color:#fff}
[data-tema=oscuro] .tabs-grandes button.on{background:var(--marca);color:#fff}
.chips-estado{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex-shrink:0}
.chips-estado button{display:flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--p1);border-radius:10px;padding:8px 13px;font-weight:500;white-space:nowrap}
.chips-estado button.on{background:#0B1220;color:#fff;border-color:#0B1220}
[data-tema=oscuro] .chips-estado button.on{background:var(--marca);border-color:var(--marca)}
.lista-top{display:flex;flex-direction:column;gap:6px}
.lista-top .f{display:flex;align-items:center;gap:10px}
.lista-top .f .bar{flex:1;height:8px;background:var(--p3);border-radius:9px;overflow:hidden}
.lista-top .f .bar i{display:block;height:100%;background:var(--marca);border-radius:9px}
#tour-capa{position:fixed;inset:0;z-index:40;pointer-events:none}
#tour-foco{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px #0F172A99;transition:.25s;pointer-events:none;outline:3px solid #fff}
#tour-caja{position:fixed;width:340px;background:#fff;color:#101828;border-radius:16px;padding:18px;box-shadow:0 20px 50px #0005;pointer-events:auto;display:flex;flex-direction:column;gap:8px;z-index:41}
#tour-caja .k{font-size:11px;font-weight:700;color:#0284C7;letter-spacing:.06em;text-transform:uppercase}
td.dens-s{padding:5px 10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--p3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:0 0 34px;position:relative}
.av .wa{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#25D366;border:2px solid var(--p1)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.vista{flex:1;min-height:0;display:flex}
.pagina{flex:1;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:18px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cab p{margin:4px 0 0;color:var(--mu);font-size:13px}
/* chats */
#carpetas{width:210px;flex:0 0 210px;border-right:1px solid var(--bd);background:var(--p1);padding:12px 8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
#carpetas button{display:flex;align-items:center;gap:9px;background:none;border:0;border-radius:9px;padding:8px 10px;font-size:13px;text-align:left;width:100%}
#carpetas button:hover{background:var(--p3)}
#carpetas button.on{background:var(--marca2);color:var(--marca);font-weight:600}
#carpetas button b{margin-left:auto;font-weight:600;font-size:12px;color:var(--mu)}
#carpetas .sec{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
#lista{width:370px;flex:0 0 370px;border-right:1px solid var(--bd);background:var(--p1);display:flex;flex-direction:column;min-height:0}
#lista .top{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--bd)}
.tabs{display:flex;background:var(--p3);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--p1);color:var(--tx);box-shadow:var(--som)}
[data-tema=oscuro] .tabs button.on{background:var(--bd2)}
#chats{flex:1;overflow:auto}
.it{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--bd);background:none;border-left:3px solid transparent;width:100%;text-align:left}
.it:hover{background:var(--p3)}
.it.sel{background:var(--marca2);border-left-color:var(--marca)}
.it .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it .nom{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ult{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .der{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.nl{background:var(--ok);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
#chat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--chatbg)}
#chat-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--p1)}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px;font-size:13px;font-weight:600}
.banner.bot{background:var(--mo2);color:var(--mo)}
.banner.hum{background:var(--am2);color:var(--am)}
#msgs{flex:1;overflow:auto;padding:16px 22px;display:flex;flex-direction:column;gap:6px}
.dia{align-self:center;font-size:11.5px;color:var(--mu);background:var(--p1);border:1px solid var(--bd);border-radius:8px;padding:3px 10px;margin:6px 0}
.m{max-width:min(72%,560px);border-radius:14px;padding:8px 11px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--som);position:relative}
.m .w{font-size:11px;font-weight:700;margin-bottom:2px}
.m .t{font-size:10.5px;color:var(--mu);text-align:right;margin-top:3px}
.m.in{align-self:flex-start;background:var(--burb-in);border-top-left-radius:4px}
.m.out{align-self:flex-end;background:var(--burb-out);border-top-right-radius:4px}
.m.ia{background:var(--burb-ia)}
.m.int{align-self:center;background:var(--am2);border:1px dashed #D9770688;max-width:85%;box-shadow:none;font-size:12.5px}
.m img.med,.m video.med{max-width:280px;max-height:320px;border-radius:10px;display:block;margin-bottom:4px;cursor:pointer}
.m audio{max-width:260px;display:block}
.m .wab{margin:6px -4px 2px;border-top:1px solid var(--bd)}
.m .wab-b{display:block;text-align:center;color:#1a8cd8;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--bd);cursor:default;list-style:none}
.m .wab-b:last-child{border-bottom:none}
.m details.wab summary{cursor:pointer}
.m details.wab summary::-webkit-details-marker{display:none}
.m .wab-l{padding:4px 8px 6px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.m .doc{display:flex;align-items:center;gap:8px;background:var(--p3);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;text-decoration:none;color:var(--tx);margin-bottom:4px}
.m .corr{position:absolute;top:-12px;right:6px;opacity:0;transition:.15s;background:var(--p1)}
.m:hover .corr{opacity:1}
#sug{margin:0 16px 8px;border:1px solid #7C3AED55;background:var(--p1);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#composer{background:var(--p1);border-top:1px solid var(--bd);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
#composer textarea{resize:none;height:44px;max-height:150px;border-radius:12px}
#composer .herr{display:flex;gap:4px;align-items:center}
#composer .herr .btn{border:0;background:none}
#composer .herr .btn:hover{background:var(--p3)}
#composer.nota textarea{background:var(--am2)}
#pop{position:absolute;bottom:110px;left:16px;right:16px;max-height:300px;overflow:auto;background:var(--p1);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px #0003;z-index:5}
#pop button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:9px 12px}
#pop button:hover{background:var(--p3)}
#ficha{width:360px;flex:0 0 360px;border-left:1px solid var(--bd);background:var(--p1);display:flex;flex-direction:column;min-height:0}
#ficha .cuerpo-f{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#ficha.cerrada{display:none}
#app.superchat #side{display:none}
.atajos{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.atajos .btn{flex-direction:column;gap:3px;min-height:54px;padding:6px 10px;font-size:11px;font-weight:600;min-width:64px}
#msgs{overflow-x:hidden}
.m{font-size:14.5px}
#composer textarea{height:58px}
.dato{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd)}
.dato span:first-child{color:var(--mu)}
.vacio{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--mu);padding:30px;text-align:center}
/* tableros */
.tablero{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;flex:1;min-height:420px;align-items:stretch}
.colk{flex:0 0 290px;background:var(--p3);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 230px)}
.colk .h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--bd)}
.colk .h b{margin-left:auto;background:var(--p1);border:1px solid var(--bd);border-radius:99px;font-size:11px;padding:1px 8px}
.colk .zona{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.colk.sobre{outline:2px dashed var(--marca);outline-offset:-2px}
.tk{background:var(--p1);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:var(--som)}
.tk:active{cursor:grabbing}
.tk .mo{font-weight:700;color:var(--ok)}
/* tablas */
.tabla{overflow-x:auto;background:var(--p2);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--som)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:11px 12px;border-bottom:1px solid var(--bd);background:var(--p3);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .k{font-size:12px;color:var(--mu);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}
.pest{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto}
.pest button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;font-size:13px;color:var(--mu);display:flex;align-items:center;gap:7px;white-space:nowrap}
.pest button.on{color:var(--marca);border-bottom-color:var(--marca)}
.pest button b{background:var(--p3);border:1px solid var(--bd);border-radius:99px;font-size:11px;padding:0 7px;color:var(--tx)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.prod{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--p1);display:flex;flex-direction:column}
.prod.on{border-color:var(--marca);box-shadow:0 0 0 1px var(--marca)}
.prod img,.prod .sinimg{width:100%;aspect-ratio:1;object-fit:cover;background:var(--p3)}
.prod .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}

let ultimoDia = null;
function cuerpoMensaje(m) {
  const url = m.media_url, t = m.tipo;
  const loc = /^\[Ubicación\]\s*(-?\d+\.\d+),\s*(-?\d+\.\d+)\s*(.*)$/s.exec(m.texto || '');
  if (loc) return `<a class="doc" href="https://www.google.com/maps?q=${loc[1]},${loc[2]}" target="_blank" rel="noopener" style="display:flex;gap:8px;align-items:center"><span style="font-size:22px">📍</span><span><b>Ubicación del cliente</b><br><span class="muted" style="font-size:12px">${esc(loc[3] || 'Ver en Google Maps')}</span></span></a>`;
  let med = '';
  if (url && (t === 'imagen' || t === 'sticker')) med = `<img class="med" src="${esc(url)}" alt="" data-ver="${esc(url)}">`;
  else if (url && t === 'video') med = `<video class="med" src="${esc(url)}" controls preload="metadata"></video>`;
  else if (url && t === 'audio') med = `<audio src="${esc(url)}" controls preload="metadata"></audio>`;
  else if (url) med = `<a class="doc" href="${esc(url)}" target="_blank" rel="noopener">${ic('doc')}<span>${esc(m.media_nombre || 'Documento')}</span></a>`;
  else if (m.media_id && ['imagen', 'video', 'audio', 'documento', 'sticker'].includes(t)) med = `<div class="muted" style="font-size:12px">⏳ Descargando ${t}…</div>`;
  let pie = '', cuerpo = m.texto || '';
  const mk = /\n?\[(Botones|Botón|Lista de agencias|Lista): ([\s\S]*)\]\s*$/.exec(cuerpo);
  if (mk) {
    cuerpo = cuerpo.slice(0, mk.index); const k = mk[1], v = mk[2];
    if (k === 'Botones') pie = `<div class="wab">${v.split(' | ').map((b) => `<div class="wab-b">↩ ${esc(b.trim())}</div>`).join('')}</div>`;
    else if (k === 'Botón') pie = `<div class="wab"><div class="wab-b">📍 ${esc(v.trim())}</div></div>`;
    else {
      const filas = k === 'Lista de agencias' ? v.split(/\),\s*/).map((x) => x.replace(/\s*\(id [^)]*\)?\s*$/, '').trim()).filter(Boolean) : v.split(/,\s*/).filter(Boolean);
      pie = `<details class="wab"><summary class="wab-b">☰ ${k === 'Lista de agencias' ? 'Ver agencias' : 'Ver opciones'}</summary><div class="wab-l">${filas.map((f) => `<div>○ ${esc(f)}</div>`).join('')}</div></details>`;
    }
  }
  const mm = { ...m, texto: cuerpo };
  return med + textoDe(mm, med, url, t) + pie;
}
function textoDe(m, med, url, t) {
  return m.texto && !/^\[(Imagen|Audio|Video|Documento|Sticker|imagen|video|audio|documento)\]/.test(m.texto) && !(url && /^(📷|🎬|🎤|📄)/.test(m.texto)) ? `<div class="tx">${fmtWA(m.texto.trim())}</div>` : (med ? '' : (m.texto === '' ? '' : `<div class="tx">${esc(m.texto || '[' + t + ']')}</div>`));
}

let grabadora = null;
async function grabar() {
  const b = $('#b-mic');
  if (grabadora) { grabadora.stop(); return; }
  const tipo = ['audio/ogg;codecs=opus', 'audio/mp4', 'audio/mpeg'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!tipo) return toast('Este navegador no graba en un formato que WhatsApp acepte. Adjunta un audio con el clip 📎.');
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const partes = []; grabadora = new MediaRecorder(st, { mimeType: tipo });
    grabadora.ondataavailable = (e) => partes.push(e.data);
    grabadora.onstop = async () => {
      st.getTracks().forEach((x) => x.stop()); b.style.color = ''; b.title = 'Grabar nota de voz'; grabadora = null;
      const ext = tipo.includes('ogg') ? 'ogg' : tipo.includes('mp4') ? 'm4a' : 'mp3';
      const file = new File([new Blob(partes, { type: tipo.split(';')[0] })], `nota-de-voz.${ext}`, { type: tipo.split(';')[0] });
      toast('Enviando nota de voz…');
      try { const a = await subirArchivo(file); await enviar({ tipo: 'audio', media_url: a.url, media_mime: a.mime, media_nombre: a.nombre }); } catch (e) { toast(e.message); }
    };
    grabadora.start(); b.style.color = 'var(--rd)'; b.title = 'Toca de nuevo para enviar'; toast('Grabando… toca el micrófono otra vez para enviar');
  } catch { toast('No tengo permiso para usar el micrófono'); }
}

        ${pp.map((x) => `<div class="entre" style="font-size:12px;background:var(--p3);border-radius:8px;padding:6px 8px"><span>Pago ${din(x.monto)} · ${esc(x.metodo || '')}${x.operacion ? ' · op. ' + esc(x.operacion) : ''}${x.verificacion === 'ok' ? ' <b style="color:var(--ok)" title="Nombre, monto, fecha y operación correctos">· ✅ IA verificó</b>' : x.verificacion === 'revisar' ? ` <b style="color:var(--rd)" title="${esc(x.motivo || '')}">· ⚠️ Revisar</b>` : ''}${x.comprobante_url ? ` · <a href="${esc(x.comprobante_url)}" target="_blank">ver comprobante</a>` : ''}${x.motivo ? `<div style="color:var(--rd);font-size:11.5px">${esc(x.motivo)}</div>` : ''}</span>${x.validado ? '<span class="chip" style="color:var(--ok)">Validado</span>' : esJefa() ? `<button class="btn sm ok" data-validar="${x.id}">Validar</button>` : '<span class="chip">Por validar</span>'}</div>`).join('')}
        <div class="fila"><select data-ped="${p.id}" style="flex:1">${Object.entries(CONFIG.estadosPedido).map(([kk, v]) => `<option value="${kk}" ${kk === p.estado ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn sm" data-pago="${p.id}">+ Pago</button></div></div>`;
      }).join('') : '<div class="muted" style="font-size:13px">Sin pedidos todavía.</div>'}
    </div>`;
  $$('#ficha [data-etapa]').forEach((b) => b.onclick = () => actualizarConv({ etapa: b.dataset.etapa, etapa_motivo: 'Cambiado por ' + yo.nombre, etapa_actualizada: new Date().toISOString() }).then(pintarFicha));
  $('#c-guardar').onclick = async () => {
    const { error } = await sb.from('contactos').update({ nombre: $('#c-nombre').value.trim() || null, dni: $('#c-dni').value.trim() || null, notas: $('#c-notas').value.trim() || null }).eq('id', k.id);
    toast(error ? 'No se pudo guardar: ' + error.message : 'Cliente guardado'); if (!error) recargar();
  };
  $$('#ficha [data-ped]').forEach((s) => s.onchange = async () => {
    const cambios = { estado: s.value }; if (s.value === 'confirmado') cambios.asesora_id = yo.id;
    const { error } = await sb.from('pedidos').update(cambios).eq('id', s.dataset.ped);
    toast(error ? error.message : 'Pedido: ' + CONFIG.estadosPedido[s.value]); pintarFicha();
  });
  $$('#ficha [data-validar]').forEach((b) => b.onclick = async () => { const { error } = await sb.from('pagos').update({ validado: true }).eq('id', b.dataset.validar); toast(error ? error.message : 'Pago validado: el pedido pasó a Confirmado'); pintarFicha(); });
  $$('#ficha [data-pago]').forEach((b) => b.onclick = () => modalPago(b.dataset.pago));
  $('#p-nuevo').onclick = modalPedido;
  $('#ficha-tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; fichaTab = b.dataset.t; $$('#ficha-tabs button').forEach((x) => x.classList.toggle('on', x === b)); $('#ficha-c').classList.toggle('hidden', fichaTab !== 'c'); $('#ficha-r').classList.toggle('hidden', fichaTab !== 'r'); };
  const pintarR = (q = '') => { $('#ficha-r').innerHTML = `<input id="fr-q" placeholder="Buscar respuesta…" value="${esc(q)}">` + rapidas.filter((r) => !q || `${r.atajo} ${r.nombre || ''} ${resumenRapida(r)}`.toLowerCase().includes(q.toLowerCase())).map((r) => `<div class="rr-mini"><div class="entre"><b>${esc(r.nombre || '/' + r.atajo)}</b><span>${iconosPasos(r)}</span></div><div class="muted" style="font-size:12px;white-space:pre-wrap">${esc(resumenRapida(r).slice(0, 140))}</div><div class="fila" style="gap:6px">${pasosDe(r).length === 1 && pasosDe(r)[0].tipo === 'texto' ? `<button class="btn sm" data-usar="${r.id}">Poner en el chat</button>` : ''}<button class="btn sm pri" data-env="${r.id}">${ic('enviar')}Enviar${pasosDe(r).length > 1 ? ` (${pasosDe(r).length})` : ''}</button></div></div>`).join('');
    $('#fr-q').oninput = (e) => { const v = e.target.value; pintarR(v); const i = $('#fr-q'); i.focus(); i.setSelectionRange(v.length, v.length); };
    $$('[data-usar]', $('#ficha-r')).forEach((b) => b.onclick = () => { const r = rapidas.find((x) => x.id === b.dataset.usar); $('#txt').value = rellenar(pasosDe(r)[0].texto); $('#txt').focus(); });
    $$('[data-env]', $('#ficha-r')).forEach((b) => b.onclick = () => enviarRapida(rapidas.find((x) => x.id === b.dataset.env)));
  };
  pintarR();
}
function modalPago(pedidoId) {
  const c = abrirModal(`<h3>Registrar pago</h3>
    <label>Monto (${CONFIG.moneda})<input id="pg-monto" type="number" step="0.01" min="0.01" value="30"></label>
    <label>Método<select id="pg-met"><option>Yape</option><option>Plin</option><option>BCP</option><option>Interbank</option><option>BBVA</option><option>Efectivo motorizado</option><option>Agencia</option></select></label>
    <label>N.º de operación<input id="pg-op" placeholder="Para detectar comprobantes repetidos"></label>
    <div class="err" id="pg-err"></div><div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn ok" id="pg-ok">Guardar pago</button></div>`);
  $('#pg-ok', c).onclick = async () => {
    const op = $('#pg-op').value.trim() || null;
    const { error } = await sb.from('pagos').insert({ pedido_id: pedidoId, conversacion_id: sel.id, monto: Number($('#pg-monto').value), metodo: $('#pg-met').value, operacion: op, registrado_por: yo.id });
    if (error) { $('#pg-err').textContent = /operacion/.test(error.message) ? '⚠ Esa operación ya fue registrada: posible comprobante repetido' : error.message; return; }
    cerrarModal(); toast('Pago guardado'); pintarFicha();
  };
}
function modalPedido() {
  const c = abrirModal(`<h3>Nuevo pedido</h3>
    <label>Producto<select id="np-prod">${productos.filter((p) => p.activo).map((p) => `<option value="${esc(p.nombre)}" data-precio="${p.precio}">${esc(p.nombre)} · ${din(p.precio)}</option>`).join('')}<option value="">Otro…</option></select></label>
    <div class="grid2"><label>Cantidad<input id="np-cant" type="number" min="1" value="1"></label><label>Total (${CONFIG.moneda})<input id="np-total" type="number" step="0.01" min="0"></label></div>
    <div class="grid3"><label>Departamento<input id="np-dep"></label><label>Provincia<input id="np-prov"></label><label>Distrito<input id="np-dist"></label></div>
    <label>Dirección<input id="np-dir"></label><label>Referencia<input id="np-ref"></label>
    <label>Entrega / courier<select id="np-cur"><option value="">Automático (Lima: Aliclik · provincia: Shalom)</option><option value="aliclik">Aliclik (Lima)</option><option value="swayp">Swayp</option><option value="shalom">Shalom (agencia)</option><option value="olva">Olva</option></select></label>
    <div class="err" id="np-err"></div><div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn ok" id="np-ok">Crear pedido</button></div>`);
  const precio = () => { const o = $('#np-prod').selectedOptions[0]; if (o?.dataset.precio) $('#np-total').value = (Number(o.dataset.precio) * Number($('#np-cant').value || 1)).toFixed(2); };
  $('#np-prod').onchange = precio; $('#np-cant').oninput = precio; precio();
  $('#np-ok', c).onclick = async () => {
    const dep = $('#np-dep').value.trim(); if (!dep || !$('#np-dir').value.trim()) { $('#np-err').textContent = 'Falta departamento o dirección'; return; }
    const lima = /lima|callao/i.test(dep + ' ' + $('#np-prov').value);
    const nombre = $('#np-prod').value || 'Producto';
    const { error } = await sb.from('pedidos').insert({ contacto_id: sel.contactos.id, conversacion_id: sel.id, estado: lima ? 'pendiente' : 'por_adelantar',
      productos: [{ nombre, cantidad: Number($('#np-cant').value), precio_total: Number($('#np-total').value) }], total: Number($('#np-total').value), adelanto: lima ? 0 : 30,
      metodo_pago: lima ? 'contraentrega' : 'adelanto', courier: $('#np-cur').value || null,
      departamento: dep, provincia: $('#np-prov').value.trim() || null, distrito: $('#np-dist').value.trim() || null, direccion: $('#np-dir').value.trim(), referencia: $('#np-ref').value.trim() || null, asesora_id: yo.id });
    if (error) { $('#np-err').textContent = error.message; return; }
    await sb.from('conversaciones').update({ monto_en_juego: Number($('#np-total').value), estado: lima ? 'por_confirmar' : 'por_adelantar', etapa: 'calificado' }).eq('id', sel.id);
    cerrarModal(); toast('Pedido creado'); pintarFicha(); recargar();
  };
}
</script>
<script>
/* ======================= TABLEROS (arrastrar y soltar) ======================= */
function activarArrastre(cont, alSoltar) {
  let arrastrando = null;
  cont.addEventListener('dragstart', (e) => { const t = e.target.closest('.tk'); if (!t) return; arrastrando = t.dataset.id; e.dataTransfer.effectAllowed = 'move'; });
  cont.addEventListener('dragover', (e) => { const z = e.target.closest('.colk'); if (!z || !arrastrando) return; e.preventDefault(); $$('.colk', cont).forEach((x) => x.classList.toggle('sobre', x === z)); });
  cont.addEventListener('dragleave', (e) => { if (!e.relatedTarget || !cont.contains(e.relatedTarget)) $$('.colk', cont).forEach((x) => x.classList.remove('sobre')); });
  cont.addEventListener('drop', async (e) => { const z = e.target.closest('.colk'); $$('.colk', cont).forEach((x) => x.classList.remove('sobre')); if (!z || !arrastrando) return; e.preventDefault(); const id = arrastrando; arrastrando = null; await alSoltar(id, z.dataset.col); });
  cont.addEventListener('dragend', () => { arrastrando = null; $$('.colk', cont).forEach((x) => x.classList.remove('sobre')); });
}

// ---------- Embudo de clientes ----------
let filtroEmbAsesora = '';
async function vistaEmbudo(soloPintar) {
  const cont = $('#p-embudo');
  if (!soloPintar || !cont.innerHTML) {
    cont.innerHTML = `<div class="cab"><div><h2>CRM de clientes</h2><p>Todos tus clientes ordenados por etapa. El bot los clasifica solo; tú o las asesoras pueden arrastrar una tarjeta para moverla.</p></div>
      <div class="fila"><input id="emb-q" placeholder="Buscar…" style="width:200px">${esJefa() ? `<select id="emb-a" style="width:auto"><option value="">Todas las asesoras</option>${equipo.filter((e) => e.activo).map((e) => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select>` : ''}</div></div>
      <div class="tablero" id="emb-t"></div>`;
    $('#emb-q').oninput = () => pintarEmbudo();
    if ($('#emb-a')) $('#emb-a').onchange = (e) => { filtroEmbAsesora = e.target.value; pintarEmbudo(); };
    activarArrastre($('#emb-t'), async (id, col) => {
      const { error } = await sb.from('conversaciones').update({ etapa: col, etapa_motivo: 'Movido por ' + yo.nombre, etapa_actualizada: new Date().toISOString() }).eq('id', id);
      if (error) return toast(error.message); const c = convs.find((x) => x.id === id); if (c) c.etapa = col; pintarEmbudo();
    });
  }
  pintarEmbudo();
}
function pintarEmbudo() {
  const t = $('#emb-t'); if (!t) return;
  const q = ($('#emb-q')?.value || '').toLowerCase();
  const l = visibles().filter((c) => (!filtroEmbAsesora || c.asignada_a === filtroEmbAsesora) && (!q || `${c.contactos?.nombre} ${c.contactos?.telefono}`.toLowerCase().includes(q)));
  t.innerHTML = CONFIG.etapas.map((e) => {
    const cs = l.filter((c) => (c.etapa || 'nuevo') === e.id);
    const monto = cs.reduce((s, c) => s + Number(c.monto_en_juego || 0), 0);
    return `<div class="colk" data-col="${e.id}"><div class="h"><span class="punto" style="background:${e.color}"></span>${e.nombre}<b>${cs.length}</b></div>
      ${monto ? `<div class="muted" style="font-size:12px;padding:6px 14px 0">${din(monto)} en juego</div>` : ''}
      <div class="zona">${cs.slice(0, 150).map((c) => { const a = equipo.find((x) => x.id === c.asignada_a); return `<div class="tk" draggable="true" data-id="${c.id}">
        <div class="entre"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.contactos?.nombre || '+' + c.contactos?.telefono)}</b>${c.monto_en_juego > 0 ? `<span class="mo">${din(c.monto_en_juego)}</span>` : ''}</div>
        <div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.ultimo_mensaje || '')}</div>
        <div class="entre" style="font-size:11.5px"><span class="muted">${a ? esc(a.nombre) : 'Sin asignar'} · ${hora(c.ultima_actividad)}</span>${c.modo_ia !== 'copiloto' ? '<span title="Bot activo">🤖</span>' : ''}</div>
        <button class="btn sm" data-abrir="${c.id}">${ic('chat')}Abrir chat</button></div>`; }).join('') || '<div class="muted" style="text-align:center;padding:16px;font-size:12px">Sin clientes en esta etapa</div>'}</div></div>`;
  }).join('');
  $$('[data-abrir]', t).forEach((b) => b.onclick = () => { ir('chats'); abrir(b.dataset.abrir); });
}

// ---------- Métricas ----------
let metRango = '7';
async function vistaMetricas() {
  const cont = $('#p-metricas'); cont.innerHTML = '<div class="muted">Calculando…</div>';
  const hasta = new Date(); const desde = new Date();
  if (metRango === 'hoy') desde.setHours(0, 0, 0, 0); else desde.setDate(desde.getDate() - Number(metRango) + 1), desde.setHours(0, 0, 0, 0);
  const [{ data: m, error }, { data: as }] = await Promise.all([sb.rpc('metricas', { p_desde: desde.toISOString(), p_hasta: hasta.toISOString() }), sb.rpc('metricas_asesoras', { p_desde: desde.toISOString(), p_hasta: hasta.toISOString() })]);
  if (error) { cont.innerHTML = `<div class="err">No pude calcular las métricas: ${esc(error.message)}</div>`; return; }
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const k = (t, v, s, col) => `<div class="card kpi"><div class="k">${t}</div><div class="v" style="${col ? 'color:' + col : ''}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const dias = m.por_dia || []; const maxD = Math.max(1, ...dias.map((d) => Math.max(d.nuevos, d.pedidos)));
  const pasos = [['Pedidos que llegaron', m.pedidos, '#2563EB'], ['Confirmados', m.confirmados, '#16A34A'], ['Enviados', m.enviados, '#7C3AED'], ['Entregados', m.entregados, '#15803D'], ['Cancelados / devueltos', m.cancelados, '#DC2626']];
  const totalMsg = (m.mensajes_bot || 0) + (m.mensajes_asesoras || 0);
  cont.innerHTML = `<div class="cab"><div><h2>Métricas</h2><p>Cómo responde tu equipo, cuánto vende el bot y cómo avanzan tus pedidos.</p></div>
      <div class="fila"><select id="met-r" style="width:auto">${[['hoy', 'Hoy'], ['7', 'Últimos 7 días'], ['15', 'Últimos 15 días'], ['30', 'Últimos 30 días'], ['90', 'Últimos 90 días']].map(([v, t]) => `<option value="${v}" ${v === metRango ? 'selected' : ''}>${t}</option>`).join('')}</select><button class="btn ico" id="met-rec" title="Actualizar">${ic('recargar')}</button></div></div>
    <div class="kpis">${k('Contactos', m.contactos)}${k('Nuevos contactos', m.nuevos)}${k('Contactos activos', m.activos, `${m.mensajes_recibidos} mensajes recibidos`)}${k('Tiempo de respuesta', dur(m.resp_prom_seg), `Bot ${dur(m.resp_bot_seg)} · Asesoras ${dur(m.resp_asesora_seg)}`)}${k('Primera respuesta', dur(m.primera_resp_seg))}${k('Sin responder', m.sin_respuesta, 'mensajes sin respuesta', m.sin_respuesta ? 'var(--rd)' : '')}</div>
    <div class="kpis">${k('Pedidos', m.pedidos, din(m.pedidos_monto) + ` · ${m.pedidos_shopify} de la web`)}${k('Confirmados', m.confirmados, pct(m.confirmados, m.pedidos) + ' de confirmación', 'var(--ok)')}${k('Entregados', m.entregados, din(m.entregados_monto) + ' · ' + pct(m.entregados, m.confirmados) + ' de entrega', 'var(--ok)')}${k('Cerrados por el bot', m.creados_bot + m.confirmados_bot, `${m.creados_bot} creados · ${m.confirmados_bot} confirmados`, 'var(--mo)')}${k('Cerrados por asesoras', m.creados_asesora + m.confirmados_asesora, `${m.creados_asesora} creados · ${m.confirmados_asesora} confirmados`)}</div>
    <div class="grid2" style="align-items:start">
      <div class="card"><h3>Embudo de pedidos</h3><div class="embudo" style="margin-top:14px">${pasos.map(([t, v, c]) => `<div class="paso-e"><div style="width:150px;font-size:12.5px">${t}</div><div class="bar"><i style="width:${m.pedidos ? Math.max(3, v / m.pedidos * 100) : 0}%;background:${c}33"></i><em>${v} · ${pct(v, m.pedidos)}</em></div></div>`).join('')}</div></div>
      <div class="card"><h3>Mensajes enviados: bot vs. humanos</h3>
        <div style="margin-top:16px;height:22px;border-radius:99px;overflow:hidden;display:flex;background:var(--p3)"><i style="width:${totalMsg ? m.mensajes_bot / totalMsg * 100 : 0}%;background:var(--mo)"></i><i style="flex:1;background:var(--marca)"></i></div>
        <div class="entre" style="margin-top:10px;font-size:13px"><span><span class="punto" style="background:var(--mo)"></span> Bot: <b>${m.mensajes_bot}</b> (${pct(m.mensajes_bot, totalMsg)})</span><span><span class="punto" style="background:var(--marca)"></span> Asesoras: <b>${m.mensajes_asesoras}</b> (${pct(m.mensajes_asesoras, totalMsg)})</span></div>
        <h3 style="margin-top:20px">Clientes por etapa</h3><div class="fila" style="margin-top:10px">${CONFIG.etapas.map((e) => `<span class="chip" style="color:${e.color}"><span class="punto" style="background:${e.color}"></span>${e.nombre}: ${m.etapas?.[e.id] || 0}</span>`).join('')}</div></div>
    </div>
    <div class="card"><div class="entre"><h3>Por día</h3><div class="fila" style="font-size:12px"><span><span class="punto" style="background:var(--bl)"></span> Nuevos contactos</span><span><span class="punto" style="background:var(--marca)"></span> Pedidos</span><span><span class="punto" style="background:var(--ok)"></span> Confirmados</span></div></div>
      <div class="barras">${dias.map((d) => `<div class="b" title="${d.dia}: ${d.nuevos} nuevos · ${d.pedidos} pedidos · ${d.confirmados} confirmados"><div style="display:flex;gap:2px;align-items:flex-end;height:140px;width:100%;justify-content:center"><i style="height:${d.nuevos / maxD * 100}%;background:var(--bl);max-width:12px"></i><i style="height:${d.pedidos / maxD * 100}%;max-width:12px"></i><i style="height:${d.confirmados / maxD * 100}%;background:var(--ok);max-width:12px"></i></div><span>${new Date(d.dia + 'T12:00').toLocaleDateString('es-PE', { day: 'numeric', month: 'short' })}</span></div>`).join('')}</div></div>
    <div class="tabla"><table><thead><tr><th>Quién</th><th>Mensajes enviados</th><th>Contactos atendidos</th><th>Tiempo de respuesta</th><th>Chats asignados</th><th>Pedidos creados</th><th>Confirmados</th></tr></thead><tbody>
      ${(as || []).map((a) => `<tr><td><div class="fila" style="gap:8px"><div class="av" style="width:28px;height:28px;flex-basis:28px;font-size:11px">${a.tipo === 'ia' ? '🤖' : esc(iniciales(a.nombre))}</div><b>${esc(a.nombre)}</b></div></td><td>${a.mensajes}</td><td>${a.contactos}</td><td>${dur(a.resp_seg)}</td><td>${a.asignadas}</td><td>${a.creados}</td><td style="font-weight:700;color:var(--ok)">${a.confirmados}</td></tr>`).join('')}</tbody></table></div>`;
  $('#met-r').onchange = (e) => { metRango = e.target.value; vistaMetricas(); };
  $('#met-rec').onclick = vistaMetricas;
}

// ---------- Catálogo ----------
async function vistaCatalogo() {
  const cont = $('#p-catalogo'); cont.innerHTML = '<div class="muted">Cargando…</div>';
  const desde = new Date(Date.now() - 30 * 864e5).toISOString();
  const [{ data: prods }, { data: peds }, { data: medios }] = await Promise.all([
    sb.from('productos').select('*').order('vende_ia', { ascending: false }).order('nombre'),
    sb.from('pedidos').select('productos, estado, total').gte('created_at', desde),
    sb.from('producto_medios').select('producto_id'),
  ]);
  productos = prods || [];
  const stats = (p) => { const n = p.nombre.toLowerCase(); const ps = (peds || []).filter((x) => (x.productos || []).some((y) => String(y.nombre || '').toLowerCase().includes(n.split(' ')[0]))); const conf = ps.filter((x) => ['confirmado', 'en_preparacion', 'enviado', 'entregado'].includes(x.estado)).length; return { pedidos: ps.length, conf, tasa: ps.length ? Math.round(conf / ps.length * 100) + '%' : '—' }; };
  cont.innerHTML = `<div class="cab"><div><h2>Catálogo</h2><p>Lo que el bot sabe de cada producto. Pedidos y confirmación de los últimos 30 días.</p></div><div class="fila"><input id="cat-q" placeholder="Buscar producto…" style="width:220px"><button class="btn" id="cat-sync">${ic('recargar')}Traer productos de Shopify</button></div></div>
    <div class="tabla"><table><thead><tr><th></th><th>Producto</th><th>Precio</th><th>Combos</th><th>El bot lo vende</th><th>Archivos</th><th>Pedidos</th><th>Confirmados</th><th>Conversión</th><th></th></tr></thead><tbody id="cat-b"></tbody></table></div>`;
  const pintar = () => {
    const q = $('#cat-q').value.toLowerCase();
    $('#cat-b').innerHTML = productos.filter((p) => !q || p.nombre.toLowerCase().includes(q)).map((p) => { const s = stats(p); const nm = (medios || []).filter((m) => m.producto_id === p.id).length; return `<tr>
      <td>${p.imagen_url ? `<img src="${esc(p.imagen_url)}" style="width:42px;height:42px;border-radius:8px;object-fit:cover">` : '<div style="width:42px;height:42px;border-radius:8px;background:var(--p3)"></div>'}</td>
      <td><b>${esc(p.nombre)}</b>${p.precio_antes ? `<div class="muted" style="font-size:11px">Antes ${din(p.precio_antes)}</div>` : ''}</td><td>${din(p.precio)}</td>
      <td style="font-size:12px">${(p.combos || []).map((c) => `${c.unidades}×${din(c.precio)}`).join(' · ') || '<span class="muted">—</span>'}</td>
      <td><label class="sw"><input type="checkbox" data-vende="${p.id}" ${p.vende_ia ? 'checked' : ''}><span></span></label></td>
      <td>${nm || '<span class="muted">0</span>'}</td><td>${s.pedidos}</td><td>${s.conf}</td><td><b>${s.tasa}</b></td>
      <td><button class="btn sm" data-conf="${p.id}">${ic('lapiz')}Configurar</button></td></tr>`; }).join('');
    $$('[data-vende]').forEach((c) => c.onchange = async () => { const { error } = await sb.from('productos').update({ vende_ia: c.checked }).eq('id', c.dataset.vende); toast(error ? error.message : c.checked ? 'El bot ya ofrece este producto' : 'El bot dejó de ofrecerlo'); const p = productos.find((x) => x.id === c.dataset.vende); if (p) p.vende_ia = c.checked; });
    $$('[data-conf]').forEach((b) => b.onclick = () => configurarProducto(b.dataset.conf, vistaCatalogo));
  };
  $('#cat-q').oninput = pintar; pintar();
  $('#cat-sync').onclick = async () => { const b = $('#cat-sync'); b.disabled = true; b.textContent = 'Trayendo…'; try { const r = await llamar('shopify', { accion: 'sincronizar' }); toast(`${r.total} productos revisados · ${r.nuevos} nuevos`); vistaCatalogo(); } catch (e) { toast(e.message); b.disabled = false; } };
}
async function configurarProducto(id, alCerrar) {
  const { data: p } = await sb.from('productos').select('*').eq('id', id).single();
  const { data: medios } = await sb.from('producto_medios').select('*').eq('producto_id', id).order('orden');
  let combos = [...(p.combos || [])], preguntas = [...(p.preguntas || [])];
  const c = abrirModal(`<div class="entre"><div class="fila">${p.imagen_url ? `<img src="${esc(p.imagen_url)}" style="width:48px;height:48px;border-radius:10px;object-fit:cover">` : ''}<div><h3>${esc(p.nombre)}</h3><div class="muted" style="font-size:12px">Lo que el bot sabe de este producto</div></div></div><button class="btn ico" data-cerrar>✕</button></div>
    <div class="fila"><label class="fila" style="flex-direction:row;gap:8px;color:var(--tx)"><span class="sw"><input type="checkbox" id="pp-vende" ${p.vende_ia ? 'checked' : ''}><span></span></span>El bot lo vende</label>
      <label class="fila" style="flex-direction:row;gap:8px;color:var(--tx)"><span class="sw"><input type="checkbox" id="pp-conf" ${p.confirmacion_activa ? 'checked' : ''}><span></span></span>Confirmar pedidos web de este producto</label></div>
    <div class="grid2"><label>Precio (${CONFIG.moneda})<input id="pp-precio" type="number" step="0.01" value="${p.precio ?? ''}"></label><label>Precio antes (tachado)<input id="pp-antes" type="number" step="0.01" value="${p.precio_antes ?? ''}"></label></div>
    <div><div class="entre"><b style="font-size:13px">Combos</b><button class="btn sm" id="pp-combo-mas">${ic('mas')}Combo</button></div><div id="pp-combos" class="col" style="margin-top:8px"></div></div>
    <label>¿Para qué sirve?<textarea id="pp-sirve" rows="2">${esc(p.para_que_sirve || '')}</textarea></label>
    <label>Ingredientes<textarea id="pp-ingr" rows="2">${esc(p.ingredientes || '')}</textarea></label>
    <label>Modo de uso<textarea id="pp-uso" rows="2">${esc(p.modo_uso || '')}</textarea></label>
    <label>Datos extra (todo lo que el bot debe saber: beneficios, resultados, garantía, promociones…)<textarea id="pp-extra" rows="4">${esc(p.info_extra || '')}</textarea></label>
    <div><div class="entre"><b style="font-size:13px">Preguntas frecuentes</b><button class="btn sm" id="pp-preg-mas">${ic('mas')}Pregunta</button></div><div id="pp-preg" class="col" style="margin-top:8px"></div></div>
    <div><div class="entre"><b style="font-size:13px">Archivos que el bot puede enviar</b><button class="btn sm" id="pp-med-mas">${ic('mas')}Subir archivo</button></div>
      <div class="galeria" id="pp-med" style="margin-top:8px"></div></div>
    <div class="fila" style="justify-content:flex-end;position:sticky;bottom:-16px;background:var(--p2);padding:10px 0"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="pp-ok">Guardar producto</button></div>`, true);
  const pintarCombos = () => { $('#pp-combos').innerHTML = combos.map((x, i) => `<div class="fila"><input type="number" min="1" value="${x.unidades}" data-ci="${i}" data-k="unidades" style="width:110px" placeholder="Unidades"><span class="muted">unidades por</span><input type="number" step="0.01" value="${x.precio}" data-ci="${i}" data-k="precio" style="width:130px" placeholder="Precio"><button class="btn ico sm" data-cx="${i}">${ic('basura')}</button></div>`).join('') || '<div class="muted" style="font-size:12px">Sin combos: el bot solo ofrece 1 unidad.</div>';
    $$('[data-ci]', c).forEach((x) => x.oninput = () => combos[x.dataset.ci][x.dataset.k] = Number(x.value)); $$('[data-cx]', c).forEach((x) => x.onclick = () => { combos.splice(x.dataset.cx, 1); pintarCombos(); }); };
  const pintarPreg = () => { $('#pp-preg').innerHTML = preguntas.map((x, i) => `<div class="card" style="padding:10px;box-shadow:none" ><div class="fila"><input value="${esc(x.pregunta || '')}" data-pi="${i}" data-k="pregunta" placeholder="Pregunta del cliente" style="flex:1"><button class="btn ico sm" data-px="${i}">${ic('basura')}</button></div><textarea rows="2" data-pi="${i}" data-k="respuesta" placeholder="Respuesta" style="margin-top:6px">${esc(x.respuesta || '')}</textarea></div>`).join('') || '<div class="muted" style="font-size:12px">Agrega las dudas que más te hacen y cómo respondes.</div>';
    $$('[data-pi]', c).forEach((x) => x.oninput = () => preguntas[x.dataset.pi][x.dataset.k] = x.value); $$('[data-px]', c).forEach((x) => x.onclick = () => { preguntas.splice(x.dataset.px, 1); pintarPreg(); }); };
  const pintarMed = (lista) => { $('#pp-med').innerHTML = (lista || []).map((m) => `<div class="med-it"><div class="pv">${vistaPrevia(m.url, m.tipo)}</div><div class="b"><input value="${esc(m.descripcion || '')}" data-md="${m.id}" placeholder="¿Cuándo enviarlo? (ej. testimonio)"><button class="btn sm peligro" data-mx="${m.id}">${ic('basura')}Quitar</button></div></div>`).join('') || '<div class="muted" style="font-size:12px">Sube fotos, videos de testimonios, audios o PDF. El bot decide cuándo enviarlos.</div>';
    $$('[data-md]', c).forEach((x) => x.onchange = () => sb.from('producto_medios').update({ descripcion: x.value }).eq('id', x.dataset.md));
    $$('[data-mx]', c).forEach((x) => x.onclick = async () => { await sb.from('producto_medios').delete().eq('id', x.dataset.mx); const { data } = await sb.from('producto_medios').select('*').eq('producto_id', id).order('orden'); pintarMed(data); }); };
  pintarCombos(); pintarPreg(); pintarMed(medios);
  $('#pp-combo-mas').onclick = () => { combos.push({ unidades: (combos.at(-1)?.unidades || 1) + 1, precio: 0 }); pintarCombos(); };
  $('#pp-preg-mas').onclick = () => { preguntas.push({ pregunta: '', respuesta: '' }); pintarPreg(); };
  $('#pp-med-mas').onclick = async () => { const f = await elegirArchivo('image/*,video/*,audio/*,application/pdf'); if (!f) return; toast('Subiendo…'); try { const a = await subirArchivo(f, 'productos'); const desc = prompt('¿Cuándo debe enviarlo el bot? (ej. "foto del frasco", "testimonio de cliente")') || a.nombre; await sb.from('producto_medios').insert({ producto_id: id, tipo: a.tipo, url: a.url, nombre: a.nombre, descripcion: desc }); const { data } = await sb.from('producto_medios').select('*').eq('producto_id', id).order('orden'); pintarMed(data); toast('Archivo agregado'); } catch (e) { toast(e.message); } };
  $('#pp-ok').onclick = async () => {
    const { error } = await sb.from('productos').update({ vende_ia: $('#pp-vende').checked, confirmacion_activa: $('#pp-conf').checked, precio: Number($('#pp-precio').value) || 0, precio_antes: Number($('#pp-antes').value) || null,
      combos: combos.filter((x) => x.unidades > 1 && x.precio > 0), preguntas: preguntas.filter((x) => x.pregunta?.trim()), para_que_sirve: $('#pp-sirve').value.trim() || null, ingredientes: $('#pp-ingr').value.trim() || null, modo_uso: $('#pp-uso').value.trim() || null, info_extra: $('#pp-extra').value.trim() || null, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) return toast(error.message); cerrarModal(); toast('Producto guardado: el bot ya usa estos datos'); if (alCerrar) alCerrar();
  };
}

// ---------- Multimedia ----------
async function vistaMultimedia() {
  const cont = $('#p-multimedia'); cont.innerHTML = '<div class="muted">Cargando…</div>';
  const { data } = await sb.from('producto_medios').select('*, productos(nombre)').order('created_at', { ascending: false });
  let filtro = '';
  cont.innerHTML = `<div class="cab"><div><h2>Multimedia</h2><p>Fotos, videos, audios y PDF que el bot puede enviar. Escribe en cada uno cuándo debe usarlo.</p></div>
    <div class="fila"><select id="mm-f" style="width:auto"><option value="">Todos</option><option value="__gen">Generales de la tienda</option>${productos.map((p) => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select><button class="btn pri" id="mm-subir">${ic('mas')}Subir archivo</button></div></div>
    <div class="galeria" id="mm-g"></div>`;
  const pintar = () => {
    const l = (data || []).filter((m) => !filtro || (filtro === '__gen' ? !m.producto_id : m.producto_id === filtro));
    $('#mm-g').innerHTML = l.map((m) => `<div class="med-it"><div class="pv" data-ver="${esc(m.url)}" data-t="${m.tipo}" style="cursor:pointer">${vistaPrevia(m.url, m.tipo)}</div><div class="b"><b style="font-size:12px">${esc(m.productos?.nombre || 'General')}</b><input value="${esc(m.descripcion || '')}" data-md="${m.id}" placeholder="¿Cuándo enviarlo?"><div class="fila" style="gap:6px"><label class="sw" title="Activo"><input type="checkbox" data-ma="${m.id}" ${m.activo ? 'checked' : ''}><span></span></label><button class="btn sm peligro" data-mx="${m.id}">${ic('basura')}</button></div></div></div>`).join('') || '<div class="muted">Aún no hay archivos.</div>';
    $$('[data-ver]').forEach((x) => x.onclick = () => { if (['imagen', 'video'].includes(x.dataset.t)) ver(x.dataset.ver, x.dataset.t); else open(x.dataset.ver); });
    $$('[data-md]').forEach((x) => x.onchange = async () => { await sb.from('producto_medios').update({ descripcion: x.value }).eq('id', x.dataset.md); toast('Guardado'); });
    $$('[data-ma]').forEach((x) => x.onchange = () => sb.from('producto_medios').update({ activo: x.checked }).eq('id', x.dataset.ma));
    $$('[data-mx]').forEach((x) => x.onclick = async () => { if (!confirm('¿Quitar este archivo?')) return; await sb.from('producto_medios').delete().eq('id', x.dataset.mx); vistaMultimedia(); });
  };
  $('#mm-f').onchange = (e) => { filtro = e.target.value; pintar(); };
  $('#mm-subir').onclick = async () => {
    const f = await elegirArchivo('image/*,video/*,audio/*,application/pdf'); if (!f) return;
    const c = abrirModal(`<h3>Nuevo archivo</h3><div class="muted">${esc(f.name)}</div>
      <label>Producto<select id="mm-p"><option value="">General de la tienda</option>${productos.map((p) => `<option value="${p.id}" ${p.id === filtro ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></label>
      <label>¿Cuándo debe enviarlo el bot?<input id="mm-d" placeholder="Ej.: testimonio de cliente que bajó de peso"></label>
      <div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="mm-ok">Subir</button></div>`);
    $('#mm-ok', c).onclick = async () => { $('#mm-ok').disabled = true; try { const a = await subirArchivo(f, 'productos'); const { error } = await sb.from('producto_medios').insert({ producto_id: $('#mm-p').value || null, tipo: a.tipo, url: a.url, nombre: a.nombre, descripcion: $('#mm-d').value.trim() || a.nombre }); if (error) throw error; cerrarModal(); toast('Archivo agregado'); vistaMultimedia(); } catch (e) { toast(e.message); $('#mm-ok').disabled = false; } };
  };
  pintar();
}

</script>
<script>
/* ======================= CONFIRMAR PEDIDOS WEB (Shopify) ======================= */
function politicasDesdeTienda(t) {
  return `${t.nombre || 'Tienda'}. Envío GRATIS a todo el Perú. Lima Metropolitana y Callao: ${t.lima_modo || 'delivery a domicilio, pago contraentrega (paga al recibir)'}, llega dentro de 24 horas. `
    + `Provincias con cobertura a domicilio (${t.zonas_domicilio || '—'}): el cliente elige domicilio (adelanto de S/${t.adelanto_domicilio}) o recojo en agencia Shalom (adelanto de S/${t.adelanto_provincia}). `
    + `Resto de provincias: envío a agencia Shalom${t.usar_olva ? ' (u Olva si no hay Shalom)' : ''} con adelanto de S/${t.adelanto_provincia}; llega en 48 a 72 horas; el saldo se paga al recoger. El adelanto se descuenta del total. `
    + `Regalo: parches para el dolor en todos los pedidos de suplementos. No hacemos promesas de curar enfermedades: hablamos de bienestar. Si no sabes si una ciudad tiene cobertura a domicilio, ofrece agencia o pasa el chat a una asesora. `
    + `Datos para el adelanto: ${String(t.cuenta_pago || '').replace(/\n+/g, ' · ')}.${t.plazos ? ' ' + t.plazos : ''}`;
}
async function vistaConfirmacion() {
  const cont = $('#p-confirmacion'); cont.innerHTML = '<div class="muted">Cargando…</div>';
  const [{ data: t }, { data: prods }, conx] = await Promise.all([sb.from('tienda').select('*').eq('id', 1).single(), sb.from('productos').select('*').order('nombre'), llamar('shopify', { accion: 'conexiones' }).catch(() => ({}))]);
  productos = prods || [];
  const activos = productos.filter((p) => p.confirmacion_activa).length;
  const on = t.confirmacion_activa;
  const plant = { APPROVED: ['Aprobada', 'var(--ok)'], PENDING: ['En revisión de Meta', 'var(--am)'], REJECTED: ['Rechazada', 'var(--rd)'], NO_CREADA: ['Sin crear', 'var(--mu)'] }[t.plantilla_estado || 'NO_CREADA'] || [t.plantilla_estado, 'var(--mu)'];
  cont.innerHTML = `<div class="cab"><div><h2>Confirma tus pedidos por WhatsApp</h2><p>Cuando entra un pedido en tu tienda Shopify, el CRM le escribe al cliente y el bot lo confirma y coordina el envío.</p></div></div>
    <div class="card ${on ? 'estado-ok' : 'estado-off'}"><div class="entre"><div><div class="muted" style="font-size:12px;font-weight:600">ESTADO DE TU TIENDA</div><h3 style="font-size:18px;margin-top:4px">${on ? 'Tu confirmación automática está encendida' : 'Tu confirmación automática está apagada'}</h3>
      <div class="muted" style="margin-top:4px">${activos} productos habilitados · Plantilla: <b style="color:${plant[1]}">${plant[0]}</b> · Pedidos de Shopify: <b style="color:${conx.shopify?.webhook_listo ? 'var(--ok)' : 'var(--am)'}">${conx.shopify?.webhook_listo ? 'conectados' : 'falta conectar (paso 4)'}</b></div></div>
      <button class="btn ${on ? '' : 'pri'}" id="cf-on">${on ? '⏸ Pausar confirmaciones' : '▶ Encender confirmaciones'}</button></div></div>
    <div class="grid2" style="align-items:start">
      <div class="col" style="gap:16px">
        <div class="card col"><div class="paso"><div class="num">1</div><div class="col" style="flex:1"><h3>Conecta tu tienda</h3><div class="muted" style="font-size:13px">Pega el enlace de tu tienda y elige el WhatsApp que enviará los mensajes.</div>
          <label>Enlace de tu tienda Shopify<input id="cf-dom" value="${esc(t.shopify_dominio || '')}" placeholder="tutienda.myshopify.com"></label>
          <label>Nombre de la tienda<input id="cf-nom" value="${esc(t.nombre || '')}"></label>
          <label>WhatsApp para tus pedidos<select disabled><option>${esc(conx.whatsapp?.nombre || 'WhatsApp')} · ${esc(conx.whatsapp?.numero || '')} · API oficial</option></select></label></div></div></div>
        <div class="card col"><div class="paso"><div class="num">2</div><div class="col" style="flex:1"><div class="entre"><h3>Activa tus productos</h3><button class="btn sm" id="cf-sync">${ic('recargar')}Actualizar productos de mi tienda</button></div>
          <div class="muted" style="font-size:13px">Solo se confirman los pedidos de los productos activados. ${t.ultima_sincronizacion ? 'Última actualización: ' + horaLarga(t.ultima_sincronizacion) : ''}</div>
          <div class="fila"><input id="cf-q" placeholder="Busca un producto" style="flex:1"><button class="btn sm" id="cf-todos">Activar todos</button><button class="btn sm" id="cf-ning">Desactivar todos</button></div>
          <div class="prods" id="cf-prods"></div></div></div></div>
      </div>
      <div class="col" style="gap:16px">
        <div class="card col"><div class="paso"><div class="num">3</div><div class="col" style="flex:1"><h3>Revisa el envío y el pago</h3>
          <label>En Lima Metropolitana y Callao<input id="cf-lima" value="${esc(t.lima_modo || '')}"></label>
          <label>Zonas con delivery a domicilio en provincia<textarea id="cf-zonas" rows="2">${esc(t.zonas_domicilio || '')}</textarea></label>
          <div class="grid2"><label>Adelanto a domicilio (S/)<input id="cf-ad" type="number" value="${t.adelanto_domicilio ?? 10}"></label><label>Adelanto en provincia (S/)<input id="cf-ap" type="number" value="${t.adelanto_provincia ?? 30}"></label></div>
          <label class="fila" style="flex-direction:row;gap:10px;color:var(--tx);font-size:13px"><span class="sw"><input type="checkbox" id="cf-olva" ${t.usar_olva ? 'checked' : ''}><span></span></span>Usar Olva Courier si no hay Shalom</label>
          <label>¿Dónde recibes el adelanto?<textarea id="cf-cuenta" rows="6">${esc(t.cuenta_pago || '')}</textarea></label>
          <label>Plazos y otras preferencias (opcional)<textarea id="cf-plazos" rows="2">${esc(t.plazos || '')}</textarea></label></div></div></div>
        <div class="card col"><div class="entre"><div><h3>Tu video de confianza</h3><div class="muted" style="font-size:13px">El bot lo envía al pedir el adelanto, para que el cliente conozca cómo trabajas.</div></div></div>
          ${t.video_confianza_url ? `<video src="${esc(t.video_confianza_url)}" controls style="width:100%;max-height:320px;border-radius:12px;background:#000"></video>` : '<div class="muted" style="font-size:13px">Aún no subes tu video.</div>'}
          <div class="fila"><button class="btn sm" id="cf-video">${ic('clip')}${t.video_confianza_url ? 'Cambiar mi video' : 'Subir video'}</button>${t.video_confianza_url ? '<button class="btn sm peligro" id="cf-video-x">Quitar video</button>' : ''}<span class="muted" style="font-size:12px">MP4 · hasta 16 MB</span></div></div>
        <div class="card"><div class="entre"><div><h3>Responder consultas con IA</h3><div class="muted" style="font-size:13px">El bot atiende las preguntas del cliente y lo acompaña durante la compra.</div></div><label class="sw"><input type="checkbox" id="cf-ia" ${t.ia_activa ? 'checked' : ''}><span></span></label></div></div>
        <div class="card col"><h3>Información general de tu tienda</h3><textarea id="cf-info" rows="4" placeholder="Horarios, quiénes son, garantías reales, cambios y devoluciones…">${esc(t.info_general || '')}</textarea></div>
      </div>
    </div>
    <div class="card col"><div class="paso"><div class="num">4</div><div class="col" style="flex:1"><h3>Conecta Shopify para recibir tus pedidos <span class="muted" style="font-weight:400;font-size:12px">Solo una vez</span></h3>
      <div class="fila"><span>Plantilla de confirmación en WhatsApp: <b style="color:${plant[1]}">${plant[0]}</b></span><button class="btn sm" id="cf-plant">${t.plantilla_estado && t.plantilla_estado !== 'NO_CREADA' ? 'Revisar estado' : 'Crear plantilla en Meta'}</button></div>
      <ol style="margin:0;padding-left:18px;line-height:1.9;font-size:13.5px">
        <li>Abre tu Shopify → <b>Configuración</b> → <b>Notificaciones</b> → <b>Webhooks</b> → <b>Crear webhook</b>.</li>
        <li>Evento: <b>Creación de pedido</b> · Formato: <b>JSON</b> · URL: <code style="background:var(--p3);padding:2px 6px;border-radius:6px">${esc(conx.webhook_url || '')}</code> <button class="btn sm" id="cf-copiar">Copiar</button></li>
        <li>Shopify te muestra una clave que empieza con "Tus webhooks se firmarán con…". Avísale a Claude para pegarla en Supabase como <code>SHOPIFY_WEBHOOK_SECRET</code>.</li>
      </ol>
      <div>Estado: <b style="color:${conx.shopify?.webhook_listo ? 'var(--ok)' : 'var(--am)'}">${conx.shopify?.webhook_listo ? '✓ Conectado' : 'Pendiente'}</b></div></div></div></div>
    <div class="card entre" style="position:sticky;bottom:0;z-index:2"><div><b>${on ? 'Confirmación automática encendida' : 'Confirmación automática apagada'}</b><div class="muted" style="font-size:12px">Guarda para aplicar los cambios del envío, pago e información.</div></div><button class="btn pri" id="cf-guardar">${ic('check')}Guardar cambios</button></div>`;

  const pintarProds = () => {
    const q = $('#cf-q').value.toLowerCase();
    $('#cf-prods').innerHTML = productos.filter((p) => !q || p.nombre.toLowerCase().includes(q)).map((p) => `<div class="prod ${p.confirmacion_activa ? 'on' : ''}">

    <div class="card entre" style="box-shadow:none"><b id="rp-txt">${rep?.activo ? 'Reparto automático activo' : 'Reparto automático pausado'}</b><label class="sw"><input type="checkbox" id="rp-on" ${rep?.activo ? 'checked' : ''}><span></span></label></div>
    <div class="entre"><b>Marca quién participa y su porcentaje</b><div class="fila"><button class="btn sm" id="rp-igual">Repartir por igual</button><span class="chip" id="rp-total"></span></div></div>
    <div class="col" id="rp-l">${equipo.filter((u) => u.activo).map((u) => `<div class="fila"><input type="checkbox" data-u="${u.id}" ${pcts[u.id] > 0 ? 'checked' : ''}><div class="av" style="width:30px;height:30px;flex-basis:30px;font-size:11px">${esc(iniciales(u.nombre))}</div><div style="flex:1"><b>${esc(u.nombre)}</b><div class="muted" style="font-size:11.5px">${CONFIG.roles[u.rol]}</div></div><input type="number" min="0" max="100" data-p="${u.id}" value="${pcts[u.id] || ''}" style="width:80px" placeholder="%"></div>`).join('')}</div>
    <div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="rp-ok">Guardar reparto</button></div>`);
  const total = () => { let t = 0; $$('[data-p]', c).forEach((i) => { const on = $(`[data-u="${i.dataset.p}"]`, c).checked; if (!on) i.value = ''; t += on ? Number(i.value || 0) : 0; }); $('#rp-total').textContent = t + '% ' + (t === 100 ? '✓ completo' : ''); $('#rp-total').style.color = t === 100 ? 'var(--ok)' : 'var(--am)'; return t; };
  c.oninput = total; c.onchange = total; total();
  $('#rp-on').onchange = () => $('#rp-txt').textContent = $('#rp-on').checked ? 'Reparto automático activo' : 'Reparto automático pausado';
  $('#rp-igual').onclick = () => { const on = $$('[data-u]', c).filter((x) => x.checked); const base = Math.floor(100 / (on.length || 1)); on.forEach((x, i) => $(`[data-p="${x.dataset.u}"]`, c).value = base + (i < 100 - base * on.length ? 1 : 0)); total(); };
  $('#rp-ok').onclick = async () => { const t = total(); if ($('#rp-on').checked && t !== 100) return toast('El total debe sumar 100%'); const p = {}; $$('[data-p]', c).forEach((i) => { if (Number(i.value) > 0) p[i.dataset.p] = Number(i.value); });
    const { error } = await sb.rpc('guardar_reparto', { p_activo: $('#rp-on').checked, p_pcts: p }); if (error) return toast(error.message); cerrarModal(); toast('Reparto guardado'); vistaEquipo(); };
}
function modalUsuario() {
  const c = abrirModal(`<h3>Agregar usuario</h3>
    <label>Nombre<input id="nu-n" placeholder="Fernanda"></label><label>Usuario (para entrar)<input id="nu-u" autocomplete="off" placeholder="fernanda"></label>
    <label>Correo para entrar (opcional, puede ser inventado)<input id="nu-c" type="email" autocomplete="off" placeholder="fernanda@unbox.pe"></label>
    <label>Rol<select id="nu-r">${Object.entries(CONFIG.roles).map(([k, v]) => `<option value="${k}" ${k === 'asesora' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label>Contraseña (mínimo 8)<input id="nu-p" type="password" minlength="8" autocomplete="new-password"></label>
    <div class="err" id="nu-e"></div><div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="nu-ok">Crear</button></div>`);
  $('#nu-ok', c).onclick = async () => { try { await llamar('admin-usuarios', { accion: 'crear', nombre: $('#nu-n').value.trim(), usuario: $('#nu-u').value.trim(), correo: $('#nu-c').value.trim() || undefined, rol: $('#nu-r').value, password: $('#nu-p').value }); cerrarModal(); toast('Usuario creado'); vistaEquipo(); } catch (e) { $('#nu-e').textContent = e.message; } };
}

  const c = abrirModal(`<h3>Nueva contraseña para ${esc(u?.nombre)}</h3><label>Contraseña (mínimo 8)<input id="np-p" type="password" minlength="8" autocomplete="new-password"></label><div class="err" id="np-e"></div><div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="np-ok">Guardar</button></div>`);
