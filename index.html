<script>
/* ======================= UTILIDADES DE FECHA ======================= */
const RANGOS = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['7', 'Últimos 7 días'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['mes_ant', 'Mes pasado'], ['30', 'Últimos 30 días'], ['90', 'Últimos 90 días']];
function rango(r) {
  const h = new Date(); const d = new Date(); d.setHours(0, 0, 0, 0); let hasta = new Date(h);
  if (r === 'ayer') { d.setDate(d.getDate() - 1); hasta = new Date(d); hasta.setHours(23, 59, 59, 999); }
  else if (r === 'semana') d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  else if (r === 'mes') d.setDate(1);
  else if (r === 'mes_ant') { d.setDate(1); d.setMonth(d.getMonth() - 1); hasta = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999); }
  else if (/^\d+$/.test(r)) d.setDate(d.getDate() - Number(r) + 1);
  const largo = hasta - d; const prevHasta = new Date(d - 1); const prevDesde = new Date(d - largo);
  return { desde: d, hasta, prevDesde, prevHasta };
}
const franjaDe = (f) => { const h = new Date(f).getHours(); return h >= 6 && h < 12 ? 'manana' : h >= 12 && h < 18 ? 'tarde' : 'noche'; };
const colDe = (estado) => CONFIG.columnasPedidos.find((c) => c.estados.includes(estado));
const esVenta = (e) => ['confirmado', 'en_preparacion', 'validado_hoy', 'enviado', 'por_recoger', 'entregado', 'incidencia'].includes(e);
const origenDe = (p) => p.origen === 'shopify' ? 'shopify' : p.creado_por_tipo === 'ia' ? 'bot' : 'asesora';
const ORIGENES = { shopify: ['Shopify', '#16A34A', 'shopify'], bot: ['Bot de WhatsApp', '#7C3AED', 'bot'], asesora: ['Manual (asesoras)', '#4F46E5', 'usuario'] };
function csv(nombre, filas) {
  const s = filas.map((f) => f.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + s], { type: 'text/csv;charset=utf-8' })); a.download = nombre; a.click();
}

/* ======================= PRIMEROS PASOS ======================= */
async function avisoPrimerosPasos() {
  if (!esJefa()) return '';
  const [{ data: t }, { count: np }, { count: nped }] = await Promise.all([sb.from('tienda').select('plantilla_estado, confirmacion_activa').eq('id', 1).single(), sb.from('productos').select('id', { count: 'exact', head: true }).eq('vende_ia', true), sb.from('pedidos').select('id', { count: 'exact', head: true })]);
  const pasos = [['Productos', np > 0, 'catalogo'], ['Plantilla de WhatsApp', t?.plantilla_estado === 'APPROVED', 'confirmacion'], ['Confirmación web', !!t?.confirmacion_activa, 'confirmacion'], ['Primer pedido', nped > 0, 'pedidos']];
  const faltan = pasos.filter((p) => !p[1]);
  if (!faltan.length) return '';
  return `<div class="avisopp"><div class="col" style="gap:8px"><b>🚀 Te faltan ${faltan.length} paso${faltan.length > 1 ? 's' : ''} para que todo funcione solo</b><div class="fila" style="gap:6px">${pasos.map((p) => `<button class="chip" data-ir="${p[2]}" style="cursor:pointer;${p[1] ? 'color:var(--ok)' : ''}">${p[1] ? '✓' : '○'} ${p[0]}</button>`).join('')}</div></div><button class="btn pri" data-ir="${faltan[0][2]}">Ver primeros pasos →</button></div>`;
}

/* ======================= DASHBOARD ======================= */
const dash = { rango: 'mes', asesora: '', franja: 'todo', canal: 'todos', tab: 'resumen' };
async function vistaDashboard() {
  const cont = $('#p-dashboard'); cont.innerHTML = '<div class="muted">Calculando…</div>';
  const r = rango(dash.rango);
  const sel = 'id, numero, estado, total, adelanto, created_at, confirmado_at, asesora_id, origen, creado_por_tipo, confirmado_por_tipo, departamento, provincia, distrito, courier, productos, contactos(nombre, telefono)';
  const [{ data: peds }, { data: prev }, { data: pagos }, { data: pagosPrev }, aviso] = await Promise.all([
    sb.from('pedidos').select(sel).gte('created_at', r.desde.toISOString()).lte('created_at', r.hasta.toISOString()).limit(5000),
    sb.from('pedidos').select('id, estado, total, asesora_id, origen, creado_por_tipo, created_at').gte('created_at', r.prevDesde.toISOString()).lte('created_at', r.prevHasta.toISOString()).limit(5000),
    sb.from('pagos').select('monto, validado, created_at, pedido_id').gte('created_at', r.desde.toISOString()).lte('created_at', r.hasta.toISOString()),
    sb.from('pagos').select('monto').gte('created_at', r.prevDesde.toISOString()).lte('created_at', r.prevHasta.toISOString()),
    avisoPrimerosPasos(),
  ]);
  const filtrar = (l) => (l || []).filter((p) => (!dash.asesora || (dash.asesora === 'bot' ? p.creado_por_tipo === 'ia' && !p.asesora_id : p.asesora_id === dash.asesora)) && (dash.franja === 'todo' || franjaDe(p.created_at) === dash.franja) && (dash.canal === 'todos' || origenDe(p) === dash.canal));
  const P = filtrar(peds), PP = filtrar(prev);
  const ids = new Set(P.map((p) => p.id));
  const sum = (l, k = 'total') => l.reduce((s, x) => s + Number(x[k] || 0), 0);
  const cuenta = (c) => P.filter((p) => c.estados.includes(p.estado));
  const ventas = P.filter((p) => esVenta(p.estado)), ventasPrev = PP.filter((p) => esVenta(p.estado));
  const entregados = P.filter((p) => p.estado === 'entregado');
  const adel = (pagos || []).filter((x) => !x.pedido_id || ids.has(x.pedido_id) || !dash.asesora);
  const efect = ventas.length ? Math.round(entregados.length / ventas.length * 100) : 0;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const delta = (a, b) => { if (!b) return a ? '<span style="color:var(--ok)">▲ nuevo</span>' : ''; const d = Math.round((a - b) / b * 100); return `<span style="color:${d >= 0 ? 'var(--ok)' : 'var(--rd)'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</span>`; };
  const nombreQuien = (id) => equipo.find((e) => e.id === id)?.nombre || 'Sin asesora';
  const hora0 = new Date().getHours();
  const saludo = hora0 < 12 ? 'Buenos días' : hora0 < 19 ? 'Buenas tardes' : 'Buenas noches';

  const etapas = `<div class="etapas-grid">
    <div class="etapa-card" style="--c:#1D4ED8" data-filtro="todos" title="Todos los pedidos que entraron en estas fechas"><div class="t">Total</div><div class="n">${P.length}</div><div class="muted" style="font-size:12px">${din(sum(P))}</div></div>
    ${CONFIG.columnasPedidos.map((c) => { const l = cuenta(c); return `<div class="etapa-card" style="--c:${c.color}" data-filtro="${c.id}" title="${esc(c.ayuda)}"><div class="t">${c.nombre}</div><div class="n">${l.length}</div><div class="muted" style="font-size:12px">${pct(l.length, P.length)} del total</div></div>`; }).join('')}</div>`;

  const porCobrar = [['En tránsito', P.filter((p) => p.estado === 'enviado'), '#0891B2', 'En camino con el courier'], ['Por recoger', P.filter((p) => p.estado === 'por_recoger'), '#EA580C', 'Esperan en la agencia'], ['Proyectados', P.filter((p) => ['confirmado', 'en_preparacion', 'validado_hoy'].includes(p.estado)), '#7C3AED', 'Confirmados pendientes de despacho']];
  const gauge = (v) => { const a = Math.PI * (1 - v / 100); const x = 105 + 90 * Math.cos(a), y = 105 - 90 * Math.sin(a); return `<div class="gauge"><svg viewBox="0 0 210 115"><path d="M15 105 A90 90 0 0 1 195 105" fill="none" stroke="var(--p3)" stroke-width="16" stroke-linecap="round"/>${v > 0 ? `<path d="M15 105 A90 90 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="var(--ok)" stroke-width="16" stroke-linecap="round"/>` : ''}</svg><b>${v}%</b></div>`; };
  const met = (titulo, icono, colorBg, colorIc, valor, sub) => `<div class="met"><div class="entre"><span class="muted" style="font-weight:500">${titulo}</span><div class="ic" style="background:${colorBg};color:${colorIc}">${ic(icono)}</div></div><div class="gr">${valor}</div><div class="muted" style="font-size:12.5px">${sub}</div></div>`;

  const principales = `<div class="grid2">
      <div class="card col"><div class="entre"><span class="fila" style="gap:8px"><span class="met" style="padding:0;border:0;background:none"><span class="ic" style="width:34px;height:34px;background:var(--ok2);color:var(--ok)">${ic('check')}</span></span><b>Confirmados en estas fechas</b></span><b style="font-size:22px">${din(sum(ventas))}</b></div><div class="gr" style="font-size:34px;font-weight:700">${ventas.length} <span style="font-size:14px">${delta(ventas.length, ventasPrev.length)}</span></div><div class="muted" style="font-size:12.5px">${ventasPrev.length} en el período anterior · ${din(sum(ventasPrev))}</div></div>
      <div class="card col"><div class="entre"><span class="fila" style="gap:8px"><span class="met" style="padding:0;border:0;background:none"><span class="ic" style="width:34px;height:34px;background:var(--bl2);color:var(--bl)">$</span></span><b>Adelantos recibidos</b></span><b style="font-size:22px">${din(sum(adel, 'monto'))}</b></div><div class="gr" style="font-size:34px;font-weight:700">${adel.length} <span style="font-size:14px">${delta(adel.length, (pagosPrev || []).length)}</span></div><div class="muted" style="font-size:12.5px">${adel.filter((x) => !x.validado).length} por validar · ${(pagosPrev || []).length} en el período anterior</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
      ${met('Pedidos', 'pedido', 'var(--bl2)', 'var(--bl)', P.length, 'Entraron en estas fechas')}
      ${met('Convertidos', 'check', 'var(--ok2)', 'var(--ok)', `${ventas.length} / ${P.length}`, pct(ventas.length, P.length) + ' de los que entraron')}
      <div class="met" style="align-items:center;justify-content:center"><b style="font-size:20px">${entregados.length} de ${ventas.length}</b>${gauge(efect)}<b>Entrega de ventas</b><span class="muted" style="font-size:12px">Entregados de los convertidos</span></div>
      ${met('Entregados', 'catalogo', 'var(--ok2)', 'var(--ok)', entregados.length, pct(entregados.length, ventas.length) + ' de los convertidos')}
      ${met('Ingresos cobrados', 'metricas', 'var(--mo2)', 'var(--mo)', din(sum(entregados)), entregados.length + ' entregas en estas fechas')}
      ${met('Ticket promedio', 'shopify', 'var(--am2)', 'var(--am)', ventas.length ? din(sum(ventas) / ventas.length) : '—', 'Por venta confirmada')}
      <div class="col" style="gap:8px"><b class="muted" style="font-size:12.5px">POR COBRAR</b>${porCobrar.map(([t, l, c, s]) => `<div style="border:1px solid ${c}44;background:${c}0F;border-radius:12px;padding:10px 12px"><div style="color:${c};font-weight:600;font-size:12.5px">${t}</div><div style="font-size:20px;font-weight:700;color:${c}">${din(sum(l))}</div><div style="font-size:11.5px;color:${c}">${l.length} · ${s}</div></div>`).join('')}</div>
    </div>`;

  const origen = `<div class="card col"><div class="entre"><h3>${ic('pedido')} Pedidos por origen</h3><span class="muted">${P.length} pedidos</span></div><div class="grid2">${Object.entries(ORIGENES).map(([k, [t, c, i]]) => { const l = P.filter((p) => origenDe(p) === k); return `<div style="border-radius:12px;padding:14px;background:${c}12;border:1px solid ${c}33" class="entre"><div class="fila"><div class="ic" style="width:38px;height:38px;border-radius:10px;background:${c};color:#fff;display:flex;align-items:center;justify-content:center">${ic(i)}</div><div><b>${t}</b><div class="muted" style="font-size:12px">${din(sum(l))} · ${pct(l.filter((p) => esVenta(p.estado)).length, l.length)} conf.</div></div></div><b style="font-size:22px">${l.length}</b></div>`; }).join('')}</div></div>`;

  const quienes = {}; ventas.forEach((p) => { const k = p.asesora_id || (p.confirmado_por_tipo === 'ia' || p.creado_por_tipo === 'ia' ? 'bot' : 'x'); quienes[k] = quienes[k] || { n: 0, m: 0, ent: 0 }; quienes[k].n++; quienes[k].m += Number(p.total); });
  entregados.forEach((p) => { const k = p.asesora_id || (p.creado_por_tipo === 'ia' ? 'bot' : 'x'); if (quienes[k]) quienes[k].ent++; });
  let topModo = dash.topModo || 'n';
  const top = Object.entries(quienes).map(([k, v]) => ({ nombre: k === 'bot' ? '🤖 Bot' : k === 'x' ? 'Sin asesora' : nombreQuien(k), ...v })).sort((a, b) => b[topModo] - a[topModo]);
  const maxTop = Math.max(1, ...top.map((x) => x[topModo]));
  const topEquipo = `<div class="card col"><div class="entre"><h3>🏆 Top del equipo</h3><div class="seg2" id="top-modo"><button data-m="n" class="${topModo === 'n' ? 'on' : ''}">Ventas</button><button data-m="m" class="${topModo === 'm' ? 'on' : ''}">Monto</button><button data-m="ent" class="${topModo === 'ent' ? 'on' : ''}">Entregado</button></div></div>
    <div class="lista-top">${top.map((x, i) => `<div class="f"><b style="width:22px">${i + 1}.</b><span style="width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.nombre)}</span><div class="bar"><i style="width:${x[topModo] / maxTop * 100}%"></i></div><b style="width:90px;text-align:right">${topModo === 'm' ? din(x.m) : x[topModo]}</b></div>`).join('') || '<div class="muted">Sin ventas con estos filtros.</div>'}</div></div>`;

  const agrupar = (l, fn) => { const o = {}; l.forEach((p) => { const k = fn(p) || '—'; o[k] = o[k] || { n: 0, m: 0 }; o[k].n++; o[k].m += Number(p.total || 0); }); return Object.entries(o).sort((a, b) => b[1].n - a[1].n); };
  const bloqueLista = (titulo, icono, datos, vacio) => { const mx = Math.max(1, ...datos.map(([, v]) => v.n)); return `<div class="card col"><h3>${icono} ${titulo}</h3><div class="lista-top">${datos.slice(0, 6).map(([k, v]) => `<div class="f"><span style="width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><div class="bar"><i style="width:${v.n / mx * 100}%"></i></div><b style="width:110px;text-align:right">${v.n} · ${din(v.m)}</b></div>`).join('') || `<div class="muted">${vacio}</div>`}</div></div>`; };
  const tipoEnvio = bloqueLista('Por tipo de envío', '🚚', agrupar(P, (p) => /lima|callao/i.test(`${p.departamento} ${p.provincia}`) ? 'Lima · contraentrega' : p.courier === 'agencia' || !p.courier ? 'Provincia · agencia' : 'Provincia · ' + p.courier), 'Sin pedidos con estos filtros.');
  const zonas = bloqueLista('Top 5 zonas', '📍', agrupar(P, (p) => [p.departamento, p.provincia].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' › ')), 'Sin pedidos con estos filtros.');
  const prodsAg = {}; P.forEach((p) => (p.productos || []).forEach((x) => { const k = x.nombre; prodsAg[k] = prodsAg[k] || { n: 0, m: 0 }; prodsAg[k].n += Number(x.cantidad || 1); prodsAg[k].m += Number(x.precio_total || 0); }));
  const topProds = bloqueLista('Productos más pedidos (unidades)', '📦', Object.entries(prodsAg).sort((a, b) => b[1].n - a[1].n), 'Sin productos.');

  // pedidos por día
  const dias = {}; for (let d = new Date(r.desde); d <= r.hasta; d.setDate(d.getDate() + 1)) dias[d.toDateString()] = { n: 0, c: 0, e: 0 };
  P.forEach((p) => { const k = new Date(p.created_at).toDateString(); if (dias[k]) { dias[k].n++; if (esVenta(p.estado)) dias[k].c++; if (p.estado === 'entregado') dias[k].e++; } });
  const dd = Object.entries(dias).slice(-45); const mxd = Math.max(1, ...dd.map(([, v]) => v.n));
  const grafDias = `<div class="card"><div class="entre"><h3>Pedidos por día</h3><div class="fila" style="font-size:12px"><span><span class="punto" style="background:var(--marca)"></span> Entraron</span><span><span class="punto" style="background:var(--ok)"></span> Confirmados</span><span><span class="punto" style="background:var(--bl)"></span> Entregados</span></div></div>
    <div class="barras">${dd.map(([k, v]) => `<div class="b" title="${new Date(k).toLocaleDateString('es-PE')}: ${v.n} entraron · ${v.c} confirmados · ${v.e} entregados"><div style="display:flex;gap:2px;align-items:flex-end;height:140px;width:100%;justify-content:center"><i style="height:${v.n / mxd * 100}%;max-width:12px"></i><i style="height:${v.c / mxd * 100}%;background:var(--ok);max-width:12px"></i><i style="height:${v.e / mxd * 100}%;background:var(--bl);max-width:12px"></i></div><span>${new Date(k).getDate()}</span></div>`).join('')}</div></div>`;

      <td style="white-space:nowrap">${x.telefono ? `<a class="btn sm ok" target="_blank" rel="noopener" href="https://wa.me/${esc(x.telefono)}?text=${encodeURIComponent(`¡Hola ${x.nombre?.split(' ')[0] || ''}! 💚 Vimos que dejaste tu pedido a medias en Unbox Perú. ¿Te ayudo a terminarlo? Envío gratis a todo el Perú.`)}">WhatsApp</a>` : ''} ${x.url_recuperacion ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(x.url_recuperacion)}">Enlace</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`
      : `<div class="card"><div class="vacio" style="padding:50px"><div style="font-size:44px">🛒</div><b>No hay carritos aquí</b><span>Aparecen solos cuando conectes el aviso de carritos en Shopify (Configuración → Notificaciones → Webhooks → "Creación de pago").</span></div></div>`;
    $$('[data-ce]').forEach((s) => s.onchange = async () => { const { error } = await sb.from('carritos').update({ estado: s.value, updated_at: new Date().toISOString(), asesora_id: yo.id }).eq('id', s.dataset.ce); toast(error ? error.message : 'Actualizado'); });
  };
  $('#ca-q').oninput = pintar; pintar();
  $('#ca-f').onclick = (e) => { const b = e.target.closest('button'); if (b) { carFiltro = b.dataset.v; vistaCarritos(); } };
  $('#ca-rec').onclick = vistaCarritos;
  $('#ca-exp').onclick = () => csv('carritos.csv', [['Fecha', 'Nombre', 'Teléfono', 'Email', 'Productos', 'Total', 'Estado'], ...l0.map((x) => [new Date(x.created_at).toLocaleString('es-PE'), x.nombre, x.telefono, x.email, (x.productos || []).map((p) => `${p.cantidad}x ${p.nombre}`).join(' + '), x.total, x.estado])]);
}

/* ======================= BUSCADOR GLOBAL ======================= */
$('#q-global').addEventListener('input', debounce(async () => {
  const q = $('#q-global').value.trim(); const box = $('#res-busca');
  if (q.length < 2) { box.classList.add('hidden'); return; }
  const like = `%${q}%`;
  const [{ data: ks }, { data: ps }] = await Promise.all([
    sb.from('contactos').select('id, nombre, telefono, dni').or(`nombre.ilike.${like},telefono.ilike.${like},dni.ilike.${like}`).limit(8),
    sb.from('pedidos').select('id, numero, total, estado, conversacion_id, contactos(nombre)').ilike('numero', like).limit(5),
  ]);
  const res = [...(ks || []).map((k) => { const c = convs.find((x) => x.contacto_id === k.id); return `<button data-conv="${c?.id || ''}">${ic('usuario')}<div><b>${esc(k.nombre || '+' + k.telefono)}</b><div class="muted" style="font-size:12px">+${esc(k.telefono)}${k.dni ? ' · DNI ' + esc(k.dni) : ''}</div></div></button>`; }),
    ...(ps || []).map((p) => `<button data-conv="${p.conversacion_id || ''}">${ic('pedido')}<div><b>${esc(p.numero)} · ${din(p.total)}</b><div class="muted" style="font-size:12px">${esc(p.contactos?.nombre || '')} · ${CONFIG.estadosPedido[p.estado]}</div></div></button>`)];
  box.innerHTML = res.join('') || '<div class="muted" style="padding:12px">Sin resultados</div>'; box.classList.remove('hidden');
  $$('#res-busca [data-conv]').forEach((b) => b.onclick = () => { box.classList.add('hidden'); $('#q-global').value = ''; if (b.dataset.conv) { ir('chats'); abrir(b.dataset.conv); } else toast('Este cliente aún no tiene chat'); });
}, 300));
document.addEventListener('click', (e) => { if (!e.target.closest('.busca')) $('#res-busca').classList.add('hidden'); });

/* ======================= GUÍA PASO A PASO ======================= */
const VISTA_TOUR = {
  dashboard: [
    ['#d-ase', 'Los filtros', 'Asesora', 'Mira las cifras de todo el equipo, de una sola persona o solo lo que vendió el bot.'],
    ['#d-ran', 'Los filtros', 'Fechas', 'Hoy, ayer, esta semana, este mes o el mes pasado. Las flechas ▲▼ comparan contra el período anterior del mismo largo.'],
    ['#d-franja', 'Los filtros', 'Hora', 'Corta todo por la hora en que entró el pedido: así sabes a qué hora te compran y refuerzas al equipo ahí.'],
    ['#d-canal', 'Los filtros', 'Canal', 'Shopify, el bot de WhatsApp o lo que crean tus asesoras a mano.'],
    ['#d-tabs', 'Los temas', 'Pestañas', 'Resumen, Pedidos, Ingresos, Conversión y entrega, Zonas y productos, y Equipo.'],
    ['.etapas-grid', 'Las etapas', 'Tarjetas de estado', 'Cuántos pedidos hay en cada etapa. Toca una tarjeta para abrir esos pedidos en el CRM.'],
  ],
  pedidos: [
    ['#pd-q', 'Pedidos', 'Buscador', 'Busca por número de pedido, cliente, teléfono, DNI o producto.'],
    ['#pd-chips', 'Pedidos', 'Estados', 'Filtra por etapa. El número dice cuántos hay en cada una.'],
    ['#pd-vista', 'Pedidos', 'Lista o tablero', 'En el tablero arrastras un pedido para cambiarlo de etapa.'],
    ['#pd-exp', 'Pedidos', 'Exportar', 'Descarga lo que estás viendo en un Excel (CSV).'],
  ],
  chats: [
    ['#carpeta', 'Super Chat', 'Bandejas y filtros', 'Todo, mis chats, sin asignar, sin responder, por etapa del embudo, por etiqueta o por asesora.'],
    ['#tab-modo', 'Super Chat', 'Humano o bot', 'Separa los chats que atiende el bot de los que atiende una persona.'],
    ['#atajos', 'Super Chat', 'Ir al CRM', 'Desde aquí saltas al Dashboard, Pedidos y demás secciones que tu rol puede ver.'],
  ],
};
let tourPasos = [], tourI = 0;
function iniciarTour(v) {
  tourPasos = (VISTA_TOUR[v] || []).filter(([s]) => $(s)); tourI = 0;
  if (!tourPasos.length) return toast('Esta pantalla todavía no tiene guía');
  $('#tour-capa').classList.remove('hidden'); pasoTour();
}
function pasoTour() {
  const [s, sec, tit, txt] = tourPasos[tourI]; const el = $(s); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(() => {
    const r = el.getBoundingClientRect(); const f = $('#tour-foco');
    Object.assign(f.style, { left: r.left - 6 + 'px', top: r.top - 6 + 'px', width: r.width + 12 + 'px', height: r.height + 12 + 'px' });
    const c = $('#tour-caja');
    c.innerHTML = `<div class="entre"><span class="k">${esc(sec)} · ${tourI + 1} de ${tourPasos.length}</span><button class="btn ico sm" id="t-x" style="border:0;background:none;color:#101828">✕</button></div><b style="font-size:16px">${esc(tit)}</b><div style="color:#475467;font-size:14px;line-height:1.5">${esc(txt)}</div>
      <div class="fila" style="justify-content:flex-end"><button class="btn" id="t-ant" style="background:#fff;color:#101828" ${tourI ? '' : 'disabled'}>‹ Anterior</button><button class="btn" id="t-sig" style="background:#0B1220;color:#fff;border-color:#0B1220">${tourI === tourPasos.length - 1 ? 'Terminar' : 'Siguiente ›'}</button></div>`;
    const below = r.bottom + 230 < innerHeight;
    c.style.top = (below ? r.bottom + 16 : Math.max(10, r.top - 220)) + 'px';
    c.style.left = Math.min(innerWidth - 360, Math.max(10, r.left)) + 'px';
    $('#t-x').onclick = cerrarTour; $('#t-ant').onclick = () => { tourI--; pasoTour(); }; $('#t-sig').onclick = () => { if (tourI === tourPasos.length - 1) return cerrarTour(); tourI++; pasoTour(); };
  }, 250);
}
function cerrarTour() { $('#tour-capa').classList.add('hidden'); }
$('#ayuda').onclick = () => iniciarTour(vistaActual);

</script>

<script>
/* ======================= ASISTENTE IA (estilo FluxWin, mejorado) ======================= */
let iaTab = leerLocal('crm_ia_tab') || 'resumen', iaSub = 'reglas', iaHist = [], iaSimTipo = 'nuevo';
async function vistaIA() {
  const cont = $('#p-ia'); cont.innerHTML = '<div class="muted">Cargando…</div>';
  const [{ data: aj }, { data: lec }, { data: prods }, { data: avisos }, { data: ventasRec }] = await Promise.all([
    sb.rpc('leer_ajustes_ia'), sb.from('ia_lecciones').select('*').order('created_at', { ascending: false }),
    sb.from('productos').select('id, nombre, precio, precio_antes, combos, vende_ia, activo').eq('activo', true).order('nombre'),
    sb.from('mensajes').select('id, texto, created_at, conversacion_id').eq('direccion', 'interno').eq('autor_tipo', 'ia').order('id', { ascending: false }).limit(40),
    sb.from('pedidos').select('productos').order('created_at', { ascending: false }).limit(400),
  ]);
  let E = {}; try { E = JSON.parse(aj?.agente_estilo || '{}'); } catch {}
  E.pasar = E.pasar || {}; E.datos = E.datos || {}; E.catalogo_ids = E.catalogo_ids || [];
  let pasos = []; try { pasos = JSON.parse(aj?.seguimiento_pasos || '[]'); } catch {}
  const prodsIA = (prods || []).filter((p) => p.vende_ia);
  const guardarAj = async (clave, valor) => { const { error } = await sb.rpc('guardar_ajuste_ia', { p_clave: clave, p_valor: valor }); if (error) { toast(error.message); throw error; } };
  let tGuard; const guardarE = () => { clearTimeout(tGuard); tGuard = setTimeout(async () => { await guardarAj('agente_estilo', JSON.stringify(E)); toast('✓ Guardado'); pintarPreview(); }, 350); };
  const masVendidos = (() => { const o = {}; (ventasRec || []).forEach((p) => (p.productos || []).forEach((x) => o[x.nombre] = (o[x.nombre] || 0) + Number(x.cantidad || 1))); return prodsIA.slice().sort((a, b) => (o[b.nombre] || 0) - (o[a.nombre] || 0)).slice(0, 10); })();

  // ---------- piezas ----------
  const opcs = (clave, lista, sub) => `<div class="opcs" data-opc="${clave}" ${sub ? `data-sub="${sub}"` : ''}>${lista.map(([v, e, t, d, r]) => `<button class="opc ${(sub ? E[sub]?.[clave] : E[clave]) === v ? 'on' : ''}" data-v="${v}">${e ? `<div class="e">${e}</div>` : ''}<b>${t}</b>${d ? `<span>${d}</span>` : ''}${r ? `<i>${r}</i>` : ''}</button>`).join('')}</div>`;
  const tg = (clave, t, d, sub) => `<div class="tg"><div><b>${t}</b><p>${d}</p></div><label class="sw"><input type="checkbox" data-tg="${clave}" ${sub ? `data-sub="${sub}"` : ''} ${(sub ? E[sub]?.[clave] : E[clave]) ? 'checked' : ''}><span></span></label></div>`;
  const sec = (ico, t, d, cuerpo, extra = '') => `<div class="card ia-sec"><div class="hd"><h3>${ico} ${t}</h3>${d ? `<p>${d}</p>` : ''}${extra}</div><div class="bd">${cuerpo}</div></div>`;
  const encendido = (clave, nombre, desc) => { const on = E[clave] !== false; return `<div class="estado-ag" style="background:${on ? 'var(--ok2)' : 'var(--p3)'}"><div class="ico" style="background:${on ? 'var(--ok)' : 'var(--bd2)'};color:#fff">${on ? '⚡' : '⏸'}</div><div style="flex:1"><b style="font-size:15px">${on ? 'Encendido' : 'Apagado'}</b><p class="muted" style="font-size:13px;margin-top:2px">${on ? desc : 'Mientras esté apagado, el bot no contesta: solo deja la respuesta sugerida y tus asesoras responden.'}</p></div><button class="btn ${on ? '' : 'pri'}" data-encender="${clave}">${on ? 'Apagar' : `Encender ${nombre}`}</button></div>`; };
  const checklistVentas = () => { const items = [['Al menos 1 producto activado para el bot', prodsIA.length > 0, 'catalogo'], ['Reglas de envío y pago', !!aj?.agente_politicas, 'confirmacion'], ['WhatsApp conectado', true, 'conexiones']]; const falta = items.filter((x) => !x[1]); return `<div style="border:1px solid ${falta.length ? '#D9770655' : '#16A34A44'};background:${falta.length ? 'var(--am2)' : 'var(--ok2)'};border-radius:12px;padding:14px" class="col"><b>${falta.length ? '⚠ Todavía no puede vender: le falta configurar' : '✅ Listo para vender'}</b>${items.map(([t, ok, v]) => `<div class="chk entre"><span class="fila" style="gap:10px"><span class="s" style="background:${ok ? 'var(--ok)' : 'var(--am)'}">${ok ? '✓' : '!'}</span>${t}</span>${ok ? '' : `<button class="btn sm" data-ir="${v}">Configurar →</button>`}</div>`).join('')}</div>`; };

  // ---------- pestañas ----------
  const T = {};
  T.resumen = () => `
    ${sec('🤖', 'Chats nuevos', 'Qué pasa cuando escribe un cliente por primera vez. Puedes cambiar cada chat a mano desde el Super Chat.', `<div class="opcs" id="ia-modo">${[['piloto', '🤖', 'El bot responde solo', 'Vende, toma datos y crea el pedido. Tus asesoras ven todo y pueden entrar cuando quieran.', 'Recomendado cuando ya no haya otro bot en el número'], ['copiloto', '👩', 'Solo sugiere', 'El bot escribe la respuesta y la asesora la envía con un toque. Nada sale solo.', 'Ideal mientras haces pruebas']].map(([v, e, t, d, r]) => `<button class="opc ${(aj?.agente_modo_global || 'copiloto') === v ? 'on' : ''}" data-v="${v}"><div class="e">${e}</div><b>${t}</b><span>${d}</span><i>${r}</i></button>`).join('')}</div>`)}
    <div class="grid2">
      <div class="card col" style="cursor:pointer" data-tab="ventas"><div class="entre"><h3>⚡ Agente de Ventas</h3><span class="chip" style="color:${E.ventas_activo !== false ? 'var(--ok)' : 'var(--mu)'}">${E.ventas_activo !== false ? '● Encendido' : 'Apagado'}</span></div><p class="muted" style="font-size:13px;line-height:1.5">Atiende a quien todavía no compró: presenta el producto, cotiza, pide los datos y crea el pedido.</p><b style="color:var(--marca);font-size:13px">Configurar →</b></div>
      <div class="card col" style="cursor:pointer" data-tab="consultas"><div class="entre"><h3>🎧 Agente de Consultas</h3><span class="chip" style="color:${E.consultas_activo !== false ? 'var(--ok)' : 'var(--mu)'}">${E.consultas_activo !== false ? '● Encendido' : 'Apagado'}</span></div><p class="muted" style="font-size:13px;line-height:1.5">Atiende a quien ya compró: cuándo llega, cuánto paga, cómo se usa. Cuida la venta, no vende de nuevo.</p><b style="color:var(--marca);font-size:13px">Configurar →</b></div></div>
    <div class="grid3">
      <div class="met"><span class="muted">Se llama</span><div class="gr">${esc(E.nombre || 'Sin nombre')}</div><span class="muted" style="font-size:12px">Tono ${esc(E.tono || 'amigable')}</span></div>
      <div class="met"><span class="muted">Productos que vende</span><div class="gr">${prodsIA.length}</div><span class="muted" style="font-size:12px">de ${(prods || []).length} activos</span></div>
      <div class="met"><span class="muted">Lecciones del equipo</span><div class="gr">${(lec || []).filter((l) => l.activo).length}</div><span class="muted" style="font-size:12px">correcciones que ya aprendió</span></div></div>
    ${checklistVentas()}`;
  T.ventas = () => `
    ${sec('⚡', 'Agente de Ventas', 'Atiende a quien te escribe por WhatsApp sin haber comprado todavía, desde un anuncio o directo: presenta el producto, resuelve dudas, cotiza, pide los datos de entrega y crea el pedido en tu CRM.', encendido('ventas_activo', 'el agente de ventas', 'Contesta solo a los clientes nuevos en los chats donde el bot está activo.') + checklistVentas())}
    ${sec('🙋‍♀️', 'Personalidad: nombre y voz', '<span class="chip" style="color:var(--bl)">Compartido con el Agente de Consultas</span> Así se presenta y así habla con tus clientes.', `<label style="max-width:360px">Nombre<input data-txt="nombre" value="${esc(E.nombre || '')}" placeholder="Ej.: Alejandra"><span class="muted" style="font-size:12px;font-weight:400">Así firma en las conversaciones. El cliente debe sentir que habla con una persona.</span></label>
      <div><b style="font-size:14px">Tono</b><div style="height:8px"></div>${opcs('tono', [['formal', '🎩', 'Formal', 'Trato de usted, profesional y cortés'], ['amigable', '😊', 'Amigable', 'Trato de tú, empático y cercano'], ['cercano', '🔥', 'Cercano', 'Muy casual, con expresiones peruanas']])}</div>`)}
    ${sec('✍️', 'Cómo escribe', 'Lo cumple el sistema en cada mensaje. Vale para los dos agentes.', `
      <div><b style="font-size:14px">Emojis</b><div style="height:8px"></div>${opcs('emojis', [['normal', '', 'Como ahora', 'Usa 1 o 2 por mensaje.'], ['pocos', '', 'Pocos', 'Como máximo uno por mensaje.'], ['ninguno', '', 'Ninguno', 'Nunca usa emojis.']])}</div>
      <label>Solo estos emojis <span class="muted" style="font-weight:400">(opcional)</span><input data-txt="emojis_permitidos" value="${esc(E.emojis_permitidos || '')}" placeholder="Pega los que quieras permitir, ej.: 😊 🚚 📦 💚"><span class="muted" style="font-size:12px;font-weight:400">Vacío: puede usar cualquiera.</span></label>
      <div><b style="font-size:14px">Signos de pregunta y exclamación</b><div style="height:8px"></div>${opcs('signos', [['whatsapp', '', 'Como en WhatsApp', 'Sin ¿ ni ¡ al inicio, como escribe la gente.'], ['completos', '', 'Con ¿ y ¡', 'Abre las preguntas y exclamaciones.']])}</div>
      ${tg('dividir', 'Dividir mensajes largos', 'Un mensaje largo sale en 2 o 3 mensajes, con unos segundos entre uno y otro, como escribe una persona. Si el cliente responde en el medio, los que faltan no salen.')}

  const pintarSim = () => { $('#sim').innerHTML = iaHist.map((h, hi) => { const burb = (x) => `<div class="m out ia" style="border:1px dashed var(--mo)"><b style="font-size:12px">${esc(x.enviaria.split(' 🔘')[0].replace(/🔘 Botones:.*$/, '') || '')}</b>${x.pie ? `<div class="tx">${fmtWA(x.pie)}</div>` : ''}${x.imagen ? `<img src="${esc(x.imagen)}" style="width:100%;max-width:340px;border-radius:8px;margin-top:6px;display:block">` : ''}${(x.lista || []).length ? `<div class="col" style="gap:4px;margin-top:6px">${x.lista.map((a) => `<button class="btn sm" data-simb="${esc(a.titulo)}" ${hi === iaHist.length - 1 ? '' : 'disabled'} style="flex-direction:column;align-items:flex-start;text-align:left;height:auto;padding:6px 10px"><b style="color:#1D8BF1">${esc(a.titulo)}</b><span class="muted" style="font-size:11px;white-space:normal">${esc(a.direccion || '')}</span></button>`).join('')}</div>` : ''}${x.ubicacion ? `<div class="col" style="gap:4px;margin-top:6px"><button class="btn sm" data-simloc="1" ${hi === iaHist.length - 1 ? '' : 'disabled'} style="justify-content:center;color:#1D8BF1;font-weight:600">📍 Enviar ubicación</button></div>` : ''}${botonesDe(x).length ? `<div class="col" style="gap:4px;margin-top:6px">${botonesDe(x).map((b) => `<button class="btn sm" data-simb="${esc(b)}" ${hi === iaHist.length - 1 ? '' : 'disabled'} style="justify-content:center;color:#1D8BF1;font-weight:600">${esc(b)}</button>`).join('')}</div>` : ''}</div>`; const med = h.medios || []; return med.filter((x) => !x.despues).map(burb).join('') + (h.texto || h.acc ? `<div class="m ${h.rol === 'cliente' ? 'in' : 'out ia'}"><div class="tx">${h.rol === 'cliente' ? esc(h.texto) : fmtWA(h.texto)}</div>${h.acc ? `<div class="t">${esc(h.acc)}</div>` : ''}</div>` : '') + med.filter((x) => x.despues).map(burb).join(''); }).join('') || `<div class="muted" style="margin:auto;text-align:center;padding:20px">${ayudaSim[iaSimTipo]}</div>`; $('#sim').scrollTop = 1e6;

  $('#sim-tipo').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; iaSimTipo = b.dataset.v; iaHist = []; $$('#sim-tipo button').forEach((x) => x.classList.toggle('on', x === b)); $('#sim-compro').classList.toggle('hidden', iaSimTipo === 'nuevo'); $('#sim-shop').classList.toggle('hidden', iaSimTipo !== 'shopify'); pintarSim(); };

    return { numero: estado === 'confirmado' ? 'UB-1001' : '#67979', origen: estado === 'confirmado' ? 'bot' : 'shopify', estado, productos: [{ nombre: pr.nombre, cantidad: cant, precio_total: tot }], total: tot, departamento: dep, provincia: prov, distrito: dist, direccion: 'Av. Los Incas 123', created_at: new Date().toISOString() }; };
  $('#sim-shop').onclick = () => { const p = pedidoSim('pendiente'); iaHist = []; enviarSim(`¡Hola! Acabo de realizar un pedido en tu tienda:💥\n\nNombre: ${$('#sim-nom').value}\nCelular: +51973555550\nDepartamento: ${p.departamento}\nProvincia: ${p.provincia}\nDistrito: ${p.distrito}\nDirección: ${p.direccion}\nProducto: ${p.productos[0].cantidad} x ${p.productos[0].nombre}\n\nEstaré atent@ para la coordinación de mi pedido😊`); };

<script>
/* ======================= RESPUESTAS RÁPIDAS (mini-flujos) ======================= */
const TIPOS_RR = { texto: ['💬', 'TEXTO'], imagen: ['🖼️', 'IMAGEN'], audio: ['🎤', 'AUDIO'], video: ['🎬', 'VIDEO'], documento: ['📄', 'DOC'] };
const ACEPTA_RR = { imagen: 'image/*', audio: 'audio/*', video: 'video/*', documento: 'application/pdf,.pdf,.doc,.docx,.xls,.xlsx' };
function pasosDe(r) { if (Array.isArray(r?.pasos) && r.pasos.length) return r.pasos; if (r?.media_url) return [{ tipo: r.media_tipo, url: r.media_url, nombre: r.media_nombre, texto: r.texto || '' }]; return r?.texto ? [{ tipo: 'texto', texto: r.texto }] : []; }
function resumenRapida(r) { const ps = pasosDe(r); const t = ps.find((p) => p.tipo === 'texto')?.texto || ps.find((p) => p.texto)?.texto; return t || (ps.length ? '(Multimedia)' : ''); }
function iconosPasos(r) { return [...new Set(pasosDe(r).map((p) => TIPOS_RR[p.tipo]?.[0] || '📎'))].join(' '); }
function rellenar(t) { const n = (sel?.contactos?.nombre || '').split(' ')[0]; return String(t || '').replace(/\{nombre\}/gi, n || '').replace(/\{asesora\}/gi, (yo?.nombre || '').split(' ')[0]); }
async function enviarRapida(r) {
  if (!sel) return toast('Abre un chat primero');
  const ps = pasosDe(r); if (!ps.length) return;
  toast(ps.length > 1 ? `Enviando ${ps.length} mensajes…` : 'Enviando…');
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    if (i > 0) await new Promise((res) => setTimeout(res, 3000));
    const bts = i === ps.length - 1 ? (r.botones || []).filter(Boolean) : [];
    try {
      if (p.tipo === 'texto') await llamar('whatsapp-enviar', { conversacion_id: sel.id, texto: rellenar(p.texto), botones: bts });
      else await llamar('whatsapp-enviar', { conversacion_id: sel.id, tipo: p.tipo, media_url: p.url, media_nombre: p.nombre, media_mime: p.mime, texto: rellenar(p.texto || ''), botones: p.tipo === 'audio' ? [] : bts });
      if (bts.length && p.tipo === 'audio') { await new Promise((res) => setTimeout(res, 2000)); await llamar('whatsapp-enviar', { conversacion_id: sel.id, texto: '👇', botones: bts }); }
    } catch (e) { toast(`Paso ${i + 1}: ${e.message}`); return; }
  }
  usoRapida(r.id); pintarChipsRR();
}
function usoRapida(id) { const u = leerLocal('crm_rr_uso') || {}; u[id] = (u[id] || 0) + 1; guardarLocal('crm_rr_uso', u); }

async function vistaRapidas() {
  await cargarRapidas();
  const cont = $('#p-rapidas');
  const puede = (r) => esJefa() || r.propietario === yo.id;
  cont.innerHTML = `<div class="cab"><div><h2 style="font-size:26px">Respuestas rápidas</h2><p>Arma mini-flujos: texto, fotos, audios, videos y PDF en el orden que quieras. En el chat se usan con <b>/</b> o desde los botones de abajo.</p></div>${esJefa() ? `<button class="btn pri" id="rr-nueva">${ic('mas')}Nueva respuesta</button>` : ''}</div>
    <div class="fila"><input id="rr-q" placeholder="Buscar respuesta…" style="flex:1"><span class="muted" style="font-size:12px">Arrastra ⠿ para ordenarlas · usa {nombre} para poner el nombre del cliente</span></div>
    <div class="rr-grid" id="rr-grid"></div>`;
  const pintar = () => {
    const q = $('#rr-q').value.toLowerCase();
    const l = rapidas.filter((r) => !q || `${r.nombre || ''} ${r.atajo} ${resumenRapida(r)}`.toLowerCase().includes(q));
    $('#rr-grid').innerHTML = l.map((r) => `<div class="rr-card" draggable="${esJefa()}" data-id="${r.id}"><div class="grip">⠿</div><div style="flex:1;min-width:0"><div class="entre" style="align-items:flex-start;gap:6px"><h4>${esc(r.nombre || r.atajo)}</h4>
      ${puede(r) ? `<div class="fila" style="gap:2px;position:relative;flex:none"><button class="btn ico sm" data-ed="${r.id}" style="border:0;color:var(--am)" title="Editar">${ic('lapiz')}</button><button class="btn ico sm" data-mn="${r.id}" style="border:0" title="Más">⋮</button></div>` : ''}</div>
      <div class="muted" style="font-size:11.5px">/${esc(r.atajo)} · ${pasosDe(r).length} ${pasosDe(r).length === 1 ? 'mensaje' : 'mensajes'}</div>
      <div class="prev">${esc(resumenRapida(r))}</div><div class="rr-ico">${pasosDe(r).map((p) => TIPOS_RR[p.tipo]?.[0] || '📎').join(' ')}${(r.botones || []).length ? ` 🔘 ${r.botones.map(esc).join(' · ')}` : ''}</div></div></div>`).join('') || '<div class="card muted">Aún no hay respuestas rápidas.</div>';
    $$('[data-ed]', cont).forEach((b) => b.onclick = () => editarRapida(rapidas.find((r) => r.id === b.dataset.ed)));
    $$('[data-mn]', cont).forEach((b) => b.onclick = (e) => { e.stopPropagation(); $$('.rr-menu').forEach((m) => m.remove()); const r = rapidas.find((x) => x.id === b.dataset.mn);
      b.parentElement.insertAdjacentHTML('beforeend', `<div class="rr-menu"><button data-a="ed">✏️ Editar</button><button data-a="dup">📄 Duplicar</button><button data-a="sub">⬆️ Subir</button><button data-a="baj">⬇️ Bajar</button><button data-a="del" style="color:var(--rd)">🗑️ Eliminar</button></div>`);
      $('.rr-menu', b.parentElement).onclick = async (ev) => { const a = ev.target.closest('button')?.dataset.a; if (!a) return; $$('.rr-menu').forEach((m) => m.remove());
        if (a === 'ed') editarRapida(r);
        if (a === 'dup') { const { error } = await sb.from('respuestas_rapidas').insert({ atajo: r.atajo + '_copia', nombre: (r.nombre || r.atajo) + ' (copia)', pasos: pasosDe(r), texto: resumenRapida(r), orden: (r.orden || 0) + 1 }); toast(error ? error.message : 'Duplicada'); vistaRapidas(); }
        if (a === 'sub' || a === 'baj') { const i = rapidas.indexOf(r), j = a === 'sub' ? i - 1 : i + 1; if (j < 0 || j >= rapidas.length) return; [rapidas[i], rapidas[j]] = [rapidas[j], rapidas[i]]; await guardarOrden(); pintar(); }
        if (a === 'del') { if (!confirm(`¿Eliminar "${r.nombre || r.atajo}"?`)) return; const { error } = await sb.from('respuestas_rapidas').delete().eq('id', r.id); toast(error ? error.message : 'Eliminada'); vistaRapidas(); } }; });
    // arrastrar para ordenar
    let arr = null;
    $$('.rr-card', cont).forEach((c) => { c.ondragstart = () => { arr = c.dataset.id; c.classList.add('drag'); }; c.ondragend = () => c.classList.remove('drag'); c.ondragover = (e) => { e.preventDefault(); c.classList.add('sobre'); }; c.ondragleave = () => c.classList.remove('sobre');
      c.ondrop = async (e) => { e.preventDefault(); c.classList.remove('sobre'); if (!arr || arr === c.dataset.id) return; const a = rapidas.findIndex((x) => x.id === arr); const [m] = rapidas.splice(a, 1); rapidas.splice(rapidas.findIndex((x) => x.id === c.dataset.id), 0, m); await guardarOrden(); pintar(); }; });
  };
  const guardarOrden = async () => { await Promise.all(rapidas.map((r, i) => (r.orden = i, sb.from('respuestas_rapidas').update({ orden: i }).eq('id', r.id)))); toast('Orden guardado'); };
  document.addEventListener('click', () => $$('.rr-menu').forEach((m) => m.remove()));
  $('#rr-q').oninput = pintar; pintar();
  if ($('#rr-nueva')) $('#rr-nueva').onclick = () => editarRapida();
}

function editarRapida(r) {
  let pasos = JSON.parse(JSON.stringify(pasosDe(r)));
  const c = abrirModal(`<div class="entre"><h3>${r ? 'Editar' : 'Nueva'} respuesta rápida</h3><button class="btn ico sm" data-cerrar>✕</button></div>
    <label>Nombre de la respuesta<input id="rr-n" value="${esc(r?.nombre || '')}" placeholder="Ej.: UNBOX - MODO DE USO DEL PARCHE"></label>
    <label>Atajo para escribir con / en el chat<input id="rr-a" value="${esc(r?.atajo || '')}" placeholder="parche"></label>
    <div><b style="font-size:13px" class="muted">Agregar contenido:</b><div style="height:6px"></div><div class="rr-add" id="rr-add">${Object.entries(TIPOS_RR).map(([k, [e, t]]) => `<button data-t="${k}"><span>${e}</span>${t}</button>`).join('')}</div></div>
    <div id="rr-pasos" class="col" style="gap:10px;max-height:46vh;overflow:auto;padding-right:4px"></div>
    <div><b style="font-size:13px" class="muted">Botones al final (opcional, hasta 3 · máx. 20 letras)</b><div style="height:6px"></div><div class="grid3" style="gap:6px">${[0, 1, 2].map((i) => `<input data-bt="${i}" maxlength="20" value="${esc(r?.botones?.[i] || '')}" placeholder="${['Ya hice el adelanto', 'Pásame el QR', 'Tengo una consulta'][i]}">`).join('')}</div><div class="muted" style="font-size:11.5px;margin-top:4px">Los botones salen pegados al último mensaje. Cuando el cliente toca uno, el bot sigue la conversación según el botón.</div></div>
    <div class="muted" style="font-size:12px;background:var(--ok2);border-radius:10px;padding:10px"><b style="color:var(--ok)">Nota:</b> al enviarla, cada elemento sale en este orden. El primero es inmediato y los siguientes salen con 3 segundos entre cada uno. Escribe <b>{nombre}</b> y se reemplaza por el nombre del cliente.</div>
    <div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="rr-ok">${ic('check')}Guardar cambios</button></div>`);
  c.style.width = 'min(640px, 96vw)';
  const pintarPasos = () => {
    $('#rr-pasos').innerHTML = pasos.map((p, i) => { const [e, t] = TIPOS_RR[p.tipo] || ['📎', p.tipo];
      const zona = p.tipo === 'texto' ? '' : `<div class="rr-zona" data-sub="${i}">${p.url ? (p.tipo === 'imagen' ? `<img src="${esc(p.url)}">` : p.tipo === 'video' ? `<video src="${esc(p.url)}" controls preload="metadata"></video>` : p.tipo === 'audio' ? `<audio src="${esc(p.url)}" controls style="width:100%"></audio>` : '') + `<div>${esc(p.nombre || 'archivo')} · <u>cambiar</u></div>` : `<div style="font-size:26px">${e}</div>Toca para subir ${t.toLowerCase()}`}</div>${p.tipo === 'audio' ? `<button class="btn sm" data-rec="${i}" style="align-self:flex-start">🎙️ Grabar audio aquí</button>` : ''}`;
      return `<div class="rr-paso"><div class="entre"><b style="font-size:13px">${e} ${t} <span class="muted">· paso ${i + 1}</span></b><div class="fila" style="gap:2px"><button class="btn ico sm" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button class="btn ico sm" data-dn="${i}" ${i < pasos.length - 1 ? '' : 'disabled'}>↓</button><button class="btn ico sm" data-x="${i}">${ic('basura')}</button></div></div>
        ${zona}${p.tipo === 'audio' ? '' : `<textarea rows="${p.tipo === 'texto' ? 4 : 2}" data-tx="${i}" placeholder="${p.tipo === 'texto' ? 'Escribe el mensaje…' : 'Texto debajo del archivo (opcional)'}">${esc(p.texto || '')}</textarea>`}</div>`; }).join('') || '<div class="muted" style="text-align:center;padding:20px">Agrega el primer contenido con los botones de arriba.</div>';
    $$('[data-tx]', c).forEach((x) => x.oninput = () => pasos[x.dataset.tx].texto = x.value);
    $$('[data-up]', c).forEach((x) => x.onclick = () => { const i = +x.dataset.up; [pasos[i - 1], pasos[i]] = [pasos[i], pasos[i - 1]]; pintarPasos(); });
    $$('[data-dn]', c).forEach((x) => x.onclick = () => { const i = +x.dataset.dn; [pasos[i + 1], pasos[i]] = [pasos[i], pasos[i + 1]]; pintarPasos(); });
    $$('[data-x]', c).forEach((x) => x.onclick = () => { pasos.splice(+x.dataset.x, 1); pintarPasos(); });
    $$('[data-sub]', c).forEach((x) => x.onclick = async () => { const i = +x.dataset.sub; const f = await elegirArchivo(ACEPTA_RR[pasos[i].tipo]); if (!f) return; x.innerHTML = 'Subiendo…'; try { const a = await subirArchivo(f, 'rapidas'); Object.assign(pasos[i], { url: a.url, nombre: a.nombre, mime: a.mime }); } catch (e) { toast(e.message); } pintarPasos(); });
    $$('[data-rec]', c).forEach((x) => x.onclick = () => grabarParaPaso(+x.dataset.rec, x));
  };
  const grabarParaPaso = async (i, b) => {
    if (b._rec) { b._rec.stop(); return; }
    const tipo = ['audio/ogg;codecs=opus', 'audio/mp4', 'audio/mpeg'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if (!tipo) return toast('Este navegador no graba en un formato que WhatsApp acepte. Sube el audio.');
    try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); const partes = []; const rec = new MediaRecorder(st, { mimeType: tipo }); b._rec = rec;
      rec.ondataavailable = (e) => partes.push(e.data);
      rec.onstop = async () => { st.getTracks().forEach((x) => x.stop()); const m = tipo.split(';')[0]; const f = new File([new Blob(partes, { type: m })], `audio.${m.includes('ogg') ? 'ogg' : m.includes('mp4') ? 'm4a' : 'mp3'}`, { type: m }); toast('Subiendo audio…'); try { const a = await subirArchivo(f, 'rapidas'); Object.assign(pasos[i], { url: a.url, nombre: a.nombre, mime: a.mime }); } catch (e) { toast(e.message); } pintarPasos(); };
      rec.start(); b.textContent = '⏹️ Toca para terminar'; b.style.color = 'var(--rd)'; } catch { toast('No tengo permiso para usar el micrófono'); }
  };
  $('#rr-add').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; pasos.push({ tipo: b.dataset.t, texto: '' }); pintarPasos(); const box = $('#rr-pasos'); box.scrollTop = 1e6; if (b.dataset.t !== 'texto') setTimeout(() => $(`[data-sub="${pasos.length - 1}"]`, c)?.click(), 50); };
  pintarPasos();
  $('#rr-ok').onclick = async () => {
    const limpios = pasos.filter((p) => p.tipo === 'texto' ? (p.texto || '').trim() : p.url);
    if (limpios.length < pasos.length && !confirm('Hay elementos vacíos o sin archivo. ¿Guardar sin ellos?')) return;
    const nombre = $('#rr-n').value.trim(); let atajo = $('#rr-a').value.trim().replace(/^\//, '').toLowerCase().replace(/\s+/g, '_');
    if (!atajo && nombre) atajo = nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 30);
    if (!atajo || !limpios.length) return toast('Ponle un nombre y al menos un contenido');
    const primero = limpios[0];
    const fila = { nombre: nombre || null, atajo, pasos: limpios, botones: $$('[data-bt]', c).map((x) => x.value.trim()).filter(Boolean).slice(0, 3), texto: limpios.find((p) => p.tipo === 'texto')?.texto || limpios.find((p) => p.texto)?.texto || null, media_url: primero.tipo !== 'texto' ? primero.url : null, media_tipo: primero.tipo !== 'texto' ? primero.tipo : null, media_nombre: primero.tipo !== 'texto' ? primero.nombre : null };
    if (!r) fila.orden = rapidas.length;
    const { error } = r ? await sb.from('respuestas_rapidas').update(fila).eq('id', r.id) : await sb.from('respuestas_rapidas').insert(fila);
    if (error) return toast(error.message); cerrarModal(); toast('✓ Guardada'); await cargarRapidas(); if (vistaActual === 'rapidas') vistaRapidas(); pintarChipsRR();
  };
}

/* botones de respuestas debajo del mensaje (las más usadas primero) */

  box.onclick = async (e) => { const b = e.target.closest('[data-rr]'); if (!b) return; const r = rapidas.find((x) => x.id === b.dataset.rr); const ps = pasosDe(r);

const _irVista = ir;

/* ======================= PEDIDO EN CURSO (se llena solo desde el chat) ======================= */
let ecomTab = 'cliente', prodsCat = null, ecomTimer = null;
const COURIERS = [['motorizado', 'Motorizado Lima (contraentrega)'], ['shalom', 'Shalom'], ['olva', 'Olva Courier'], ['marvisur', 'Marvisur'], ['agencia', 'Otra agencia']];
const _pintarFicha = pintarFicha;
pintarFicha = async function (...a) { await _pintarFicha.apply(this, a); await montarEcom(); };
async function montarEcom() {
  const c = sel; if (!c || !$('#ficha-c')) return;
  if (!prodsCat) { const { data } = await sb.from('productos').select('id, nombre, precio, combos').eq('activo', true).order('nombre'); prodsCat = data || []; }
  const [{ data: conv }, { data: abiertos }] = await Promise.all([
    sb.from('conversaciones').select('borrador, probabilidad, asignada_a').eq('id', c.id).single(),
    sb.from('pedidos').select('*').eq('conversacion_id', c.id).order('created_at', { ascending: false }).limit(1),
  ]);
  const ped = abiertos?.[0] && !['entregado', 'cancelado', 'devuelto'].includes(abiertos[0].estado) ? abiertos[0] : null;
  const k = c.contactos || {};
  const B = { recibe: k.nombre || '', celular: k.telefono || '', dni: k.dni || '', ...(ped ? { recibe: ped.recibe || k.nombre, celular: ped.celular || k.telefono, departamento: ped.departamento, provincia: ped.provincia, distrito: ped.distrito, direccion: ped.direccion, referencia: ped.referencia, courier: ped.courier, tipo_entrega: ped.tipo_entrega, productos: ped.productos, total: ped.total, adelanto: ped.adelanto, nota: ped.nota } : {}), ...Object.fromEntries(Object.entries(conv?.borrador || {}).filter(([, v]) => v !== '' && v != null)) };
  B.productos = B.productos || [];
  const campos = ['recibe', 'departamento', 'provincia', 'distrito', 'direccion', 'dni', 'celular'];
  const llenos = campos.filter((x) => B[x]).length + (B.productos.length ? 1 : 0);
  const pct = Math.round(llenos / (campos.length + 1) * 100);
  const ase = equipo.find((e) => e.id === (conv?.asignada_a || c.asignada_a));
  const inp = (k2, t, ph = '') => `<label>${t}<input data-b="${k2}" value="${esc(B[k2] ?? '')}" placeholder="${ph}" class="${B[k2] ? 'lleno' : ''}"></label>`;
  const total = () => B.productos.reduce((s, p) => s + Number(p.precio_total || 0), 0);
  const html = `<div class="ecom" id="ecom"><div class="top">
      <div class="entre"><b style="font-size:13px">🛒 PEDIDO EN CURSO</b><span style="font-size:12px">Score <span class="sc">${conv?.probabilidad || 0}/100</span></span></div>
      <div class="entre" style="font-size:12px"><span class="muted">Atiende: <b style="color:var(--tx)">${esc(ase?.nombre || '🤖 Bot')}</b></span><span class="muted">${pct}% completo</span></div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      ${ped ? `<div class="num"><span>#${esc(ped.numero || '—')}</span><span>${new Date(ped.created_at).toLocaleDateString('es-PE')}</span><span style="color:var(--ok)">${din(ped.total)}</span><span class="muted" style="margin-left:auto">${esc(CONFIG.estadosPedido[ped.estado] || ped.estado)}</span></div>` : ''}
      <div class="g2"><button class="btn sm ${ped ? '' : 'pri'}" id="ec-crear">${ped ? '💾 Guardar en el pedido' : '🛒 Crear pedido'}</button><button class="btn sm" id="ec-ia" title="La IA lee el chat y llena los datos">⚡ Completar datos</button></div></div>
    <div class="bd"><div class="seg2" id="ec-tabs"><button data-v="cliente" class="${ecomTab === 'cliente' ? 'on' : ''}" style="flex:1">👤 Cliente</button><button data-v="envio" class="${ecomTab === 'envio' ? 'on' : ''}" style="flex:1">🚚 Envío</button></div>
      ${ecomTab === 'cliente' ? `${inp('recibe', 'Nombre de quien recibe')}${inp('departamento', 'Departamento')}<div class="g2">${inp('provincia', 'Provincia')}${inp('distrito', 'Distrito')}</div>${inp('direccion', 'Dirección')}<div class="g2">${inp('referencia', 'Referencia')}${inp('dni', 'DNI', 'Documento')}</div><label>Celular<div class="fila" style="gap:6px"><input data-b="celular" value="${esc(B.celular || '')}" class="${B.celular ? 'lleno' : ''}" style="flex:1"><button class="btn ico sm" id="ec-copiar" title="Copiar">⧉</button></div></label>`
      : `<label>Tipo de entrega<select data-b="tipo_entrega"><option value="">—</option><option value="domicilio" ${B.tipo_entrega === 'domicilio' ? 'selected' : ''}>A domicilio</option><option value="agencia" ${B.tipo_entrega === 'agencia' ? 'selected' : ''}>Recojo en agencia</option></select></label>
        <label>Courier<select data-b="courier"><option value="">—</option>${COURIERS.map(([v, t]) => `<option value="${v}" ${B.courier === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <b style="font-size:12px" class="muted">PRODUCTOS</b>
        <div class="col" style="gap:6px" id="ec-prods">${B.productos.map((p, i) => `<div class="pr"><input value="${esc(p.nombre)}" data-pn="${i}"><input type="number" min="1" value="${p.cantidad || 1}" data-pc="${i}"><input type="number" step="0.1" value="${p.precio_total || 0}" data-pp="${i}"><button class="btn ico sm" data-px="${i}">✕</button></div>`).join('') || '<div class="muted" style="font-size:12px">Sin productos todavía.</div>'}</div>
        <select id="ec-add"><option value="">+ Agregar producto del catálogo</option>${prodsCat.map((p) => `<option value="${p.id}">${esc(p.nombre)} · S/${p.precio}</option>`).join('')}</select>
        <div class="g2"><label>Total<input data-b="total" type="number" step="0.1" value="${B.total ?? total()}"></label><label>Adelanto<input data-b="adelanto" type="number" step="0.1" value="${B.adelanto ?? (/lima|callao/i.test(`${B.departamento} ${B.provincia}`) || !B.departamento ? 0 : 30)}"></label></div>

  const cp = $('#ec-copiar'); if (cp) cp.onclick = () => { navigator.clipboard.writeText(B.celular || ''); toast('Copiado'); };
  const recalc = () => { B.total = total(); guardarB(); montarEcom(); };
  $$('[data-pn]').forEach((x) => x.onchange = () => { B.productos[x.dataset.pn].nombre = x.value; guardarB(); });
  $$('[data-pc]').forEach((x) => x.onchange = () => { const p = B.productos[x.dataset.pc]; p.cantidad = Number(x.value) || 1; const cat = prodsCat.find((q) => q.nombre === p.nombre); if (cat) { const cb = (cat.combos || []).find((q) => q.unidades === p.cantidad); p.precio_total = cb ? cb.precio : cat.precio * p.cantidad; } recalc(); });
  $$('[data-pp]').forEach((x) => x.onchange = () => { B.productos[x.dataset.pp].precio_total = Number(x.value); recalc(); });
  $$('[data-px]').forEach((x) => x.onclick = () => { B.productos.splice(+x.dataset.px, 1); recalc(); });
  const add = $('#ec-add'); if (add) add.onchange = () => { const p = prodsCat.find((q) => q.id === add.value); if (!p) return; B.productos.push({ nombre: p.nombre, cantidad: 1, precio_total: Number(p.precio) }); recalc(); };
  $('#ec-ia').onclick = async () => { const b = $('#ec-ia'); b.disabled = true; b.textContent = 'Leyendo el chat…'; try { const r = await llamar('agente', { conversacion_id: c.id, extraer: true }); toast(r.campos ? `✓ ${r.campos} datos completados` : 'No encontré datos nuevos en el chat'); } catch (e) { toast(e.message); } montarEcom(); };
  $('#ec-crear').onclick = async () => {
    const falta = ['recibe', 'departamento', 'provincia', 'distrito', 'direccion'].filter((x) => !B[x]);

    if (error) return toast(error.message);
    if (B.dni || B.recibe) await sb.from('contactos').update({ ...(B.dni ? { dni: B.dni } : {}), ...(!k.nombre && B.recibe ? { nombre: B.recibe } : {}) }).eq('id', k.id);
    toast(ped ? '✓ Pedido actualizado' : '✓ Pedido creado'); pintarFicha();
  };
  // se actualiza solo mientras el bot va anotando
  clearInterval(ecomTimer);
  let ultimo = JSON.stringify(conv?.borrador || {});

    const { data } = await sb.from('conversaciones').select('borrador').eq('id', c.id).single(); const s = JSON.stringify(data?.borrador || {}); if (s !== ultimo) { ultimo = s; montarEcom(); } }, 6000);

<script>

    .replace(/(^|[\s(])_(?!\s)([^_\n]+?)_(?=[\s.,!?):]|$)/gm, '$1<i>$2</i>').replace(/(^|[\s(])~(?!\s)([^~\n]+?)~(?=[\s.,!?):]|$)/gm, '$1<s>$2</s>');
}

/* ---------- modo Responder / Nota interna (más claro que el check) ---------- */
const _abrirChat2 = abrir;
abrir = async function (...a) {

    $$('#modo-comp button').forEach((x) => x.classList.toggle('on', x === b)); $('#txt').placeholder = nota ? 'Nota para tu equipo: el cliente NO la ve…' : ph; $('#enviar').innerHTML = nota ? '📝 Guardar nota' : `${ic('enviar')}Enviar`; $('#txt').focus(); };
  return r;
};

/* ---------- ficha: sin datos repetidos ---------- */
const _pintarFicha2 = pintarFicha;
pintarFicha = async function (...a) {
  await _pintarFicha2.apply(this, a);

/* ---------- Integraciones listas para conectar ---------- */
const INTEG = {

const _vistaConexiones = vistaConexiones;
vistaConexiones = async function (...a) {
  await _vistaConexiones.apply(this, a);
  const { data } = await sb.from('integraciones').select('*');
  const I = Object.fromEntries((data || []).map((x) => [x.nombre, x]));
  $$('#p-conexiones .card').forEach((card) => {
    const tit = card.querySelector('b')?.textContent?.trim(); const k = Object.keys(INTEG).find((x) => INTEG[x].t === tit); if (!k) return;

    fila.insertAdjacentHTML('beforeend', `<button class="btn sm ${conf ? '' : 'pri'}" data-integ="${k}">${k === 'tiktok' ? 'Avisarme' : conf ? 'Editar' : 'Conectar'}</button>`);
  });
  $$('[data-integ]').forEach((b) => b.onclick = () => modalInteg(b.dataset.integ, I[b.dataset.integ] || {}));
};
function modalInteg(k, it) {
  const d = INTEG[k], cf = it.config || {};
  const auto = k === 'instagram' || k === 'facebook';
  const c = abrirModal(`<div class="entre"><h3>${d.ico} Conectar ${d.t}</h3><button class="btn ico sm" data-cerrar>✕</button></div>

    ${auto ? `<div><b style="font-size:13px">Qué hace el bot con los comentarios</b><div style="height:6px"></div><select data-cf="modo"><option value="sugerir" ${cf.modo !== 'automatico' ? 'selected' : ''}>Sugiere la respuesta y una persona la aprueba</option><option value="automatico" ${cf.modo === 'automatico' ? 'selected' : ''}>Responde solo</option></select></div>
      <label class="fila" style="flex-direction:row;gap:8px"><input type="checkbox" data-cf="ocultar" ${cf.ocultar ? 'checked' : ''}>Ocultar comentarios con groserías o de la competencia</label>
      <label class="fila" style="flex-direction:row;gap:8px"><input type="checkbox" data-cf="dm" ${cf.dm !== false ? 'checked' : ''}>Mandar mensaje privado a quien comente una palabra clave</label>` : ''}
    ${k === 'zentro' ? `<label class="fila" style="flex-direction:row;gap:8px"><input type="checkbox" data-cf="auto_envio" ${cf.auto_envio ? 'checked' : ''}>Mandar a Zentro cada pedido apenas quede confirmado</label>` : ''}
    <div class="muted" style="font-size:12px;background:var(--bl2);border-radius:10px;padding:10px">Esto deja todo listo. La conexión real la activo yo cuando me digas "activa ${d.t}" en el chat: sin pasos técnicos para ti.</div>
    <div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="ig-ok">Guardar</button></div>`);
  $('#ig-ok', c).onclick = async () => {
    const config = { ...cf }; $$('[data-cf]', c).forEach((x) => config[x.dataset.cf] = x.type === 'checkbox' ? x.checked : x.value.trim());
    const listo = d.campos.filter(([f]) => f !== 'tienda' && f !== 'palabras').every(([f]) => config[f]);
    const { error } = await sb.from('integraciones').upsert({ nombre: k, config, estado: listo ? 'configurado' : 'sin_conectar', updated_at: new Date().toISOString(), updated_by: yo.id });
    if (error) return toast(error.message); cerrarModal(); toast(listo ? `✓ ${d.t} listo para activar` : 'Guardado'); vistaConexiones();
  };
}

<script>
/* ---------- recuperar contraseña con código por correo ---------- */
$('#olvide').onclick = () => {
  const caja = $('#f-login'); const antes = caja.innerHTML;
  caja.innerHTML = `<div class="logo"><div class="u marca-letra">U</div><b class="marca-nombre">CRM</b></div><h2>Recuperar contraseña</h2>
    <p class="muted" style="font-size:13px">Te mandamos un código de 6 dígitos a tu correo.</p>
    <label>Tu correo o usuario<input id="rc-u" autocomplete="username"></label><button type="button" class="btn pri" id="rc-env">Enviarme el código</button>
    <div id="rc-paso2" class="col hidden" style="gap:10px"><label>Código del correo<input id="rc-c" inputmode="numeric" maxlength="8" placeholder="123456"></label><label>Nueva contraseña (mínimo 8)<input id="rc-p" type="password" autocomplete="new-password"></label><button type="button" class="btn ok" id="rc-ok">Cambiar y entrar</button></div>
    <div class="err" id="rc-e"></div><button type="button" class="btn" id="rc-volver" style="border:0;background:none">‹ Volver</button>`;
  let email = '';
  $('#rc-volver').onclick = () => location.reload();
  $('#rc-env').onclick = async () => { $('#rc-e').textContent = ''; email = await correoLogin($('#rc-u').value);
    if (email.endsWith('@' + CONFIG.dominioUsuarios)) return $('#rc-e').textContent = 'Pídele a tu administrador que te cambie la contraseña desde Usuarios y permisos.';
    const { error } = await sb.auth.resetPasswordForEmail(email); if (error) return $('#rc-e').textContent = 'No pude enviar el código. Si eres asesora, pídele a tu administrador que te cambie la contraseña.';
    $('#rc-paso2').classList.remove('hidden'); $('#rc-env').textContent = 'Reenviar código'; toast('📩 Te enviamos el código a ' + email.replace(/(.{2}).+(@.+)/, '$1•••$2')); };
  $('#rc-ok').onclick = async () => { $('#rc-e').textContent = '';
    if ($('#rc-p').value.length < 8) return $('#rc-e').textContent = 'La contraseña debe tener al menos 8 caracteres';
    const { error } = await sb.auth.verifyOtp({ email, token: $('#rc-c').value.trim(), type: 'recovery' }); if (error) return $('#rc-e').textContent = 'Código incorrecto o vencido';
    const { error: e2 } = await sb.auth.updateUser({ password: $('#rc-p').value }); if (e2) return $('#rc-e').textContent = e2.message;
    toast('✓ Contraseña cambiada'); entrar(); };
};
/* ---------- cada usuario puede poner su correo ---------- */
const _vistaEquipo = vistaEquipo;
vistaEquipo = async function (...a) {
  await _vistaEquipo.apply(this, a);
  const cab = $('#p-equipo .cab .fila'); if (!cab || $('#mi-correo')) return;
  cab.insertAdjacentHTML('afterbegin', `<button class="btn" id="mi-correo">📧 ${yo.correo ? 'Mi correo: ' + esc(yo.correo) : 'Agregar mi correo'}</button>`);
  $('#mi-correo').onclick = () => { const c = abrirModal(`<h3>Tu correo</h3><p class="muted" style="font-size:13px">Sirve para recuperar tu contraseña si la olvidas. También puedes entrar escribiendo tu correo en vez del usuario.</p><label>Correo<input id="mc-c" type="email" value="${esc(yo.correo || '')}"></label><div class="err" id="mc-e"></div><div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="mc-ok">Guardar</button></div>`);
    $('#mc-ok', c).onclick = async () => { try { await llamar('admin-usuarios', { accion: 'mi_correo', correo: $('#mc-c').value.trim() }); yo.correo = $('#mc-c').value.trim(); cerrarModal(); toast('✓ Correo guardado'); vistaEquipo(); } catch (e) { $('#mc-e').textContent = e.message; } }; };
  // correo de cada asesora en su tarjeta (el admin lo cambia)
  [...($('#p-equipo [style*="minmax(250px"]')?.children || [])].forEach((card, i) => { const u = equipo[i]; if (!u || !esJefa()) return; card.insertAdjacentHTML('beforeend', `<div class="muted" style="font-size:12px">📧 ${esc(u.correo || (u.usuario + '@' + CONFIG.dominioUsuarios))} ${yo.rol === 'admin' && u.id !== yo.id ? `<a href="#" data-uc="${u.id}">cambiar</a>` : ''}</div>`); });
  $$('[data-uc]').forEach((l) => l.onclick = (e) => { e.preventDefault(); const u = equipo.find((x) => x.id === l.dataset.uc); const c = abrirModal(`<h3>Correo de ${esc(u.nombre)}</h3><p class="muted" style="font-size:13px">Puede ser inventado (ej. ${esc(u.usuario)}@unbox.pe). Sirve para entrar; si olvida su contraseña, tú se la cambias con el botón "Contraseña".</p><label>Correo<input id="uc-c" type="email" value="${esc(u.correo || '')}"></label><div class="err" id="uc-e"></div><div class="fila" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="uc-ok">Guardar</button></div>`);
    $('#uc-ok', c).onclick = async () => { try { await llamar('admin-usuarios', { accion: 'actualizar', id: u.id, correo: $('#uc-c').value.trim() }); cerrarModal(); toast('✓ Correo guardado'); vistaEquipo(); } catch (e) { $('#uc-e').textContent = e.message; } }; });
};

<script>
/* Contador de gasto del bot (Claude) en el Dashboard — solo lo ve la jefa */
(function () {
  const base = vistaDashboard;
  vistaDashboard = async function () {
    await base.apply(this, arguments);
    const cont = document.querySelector('#p-dashboard');
    if (!cont || cont.querySelector('#gasto-ia')) return;
    const { data, error } = await sb.rpc('gasto_ia', { p_dias: 30 });
    if (error || !data) return;
    const hoyLima = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Lima' });
    const hoy = data.find((d) => d.dia === hoyLima) || { costo_usd: 0, respuestas_chat: 0, llamadas: 0, simulacion: 0 };
    const mes = data.filter((d) => d.dia.slice(0, 7) === hoyLima.slice(0, 7));
    const sumMes = mes.reduce((s, d) => s + Number(d.costo_usd || 0), 0);
    const dias7 = data.slice(0, 7);
    const prom = dias7.length ? dias7.reduce((s, d) => s + Number(d.costo_usd || 0), 0) / dias7.length : 0;
    const diasMes = new Date(new Date(hoyLima).getFullYear(), new Date(hoyLima).getMonth() + 1, 0).getDate();
    const proy = prom * diasMes;
    const usd = (n) => { n = Number(n || 0); return 'US$ ' + n.toFixed(n === 0 ? 2 : n < 0.1 ? 4 : n < 10 ? 2 : 0); };
    const sol = (n) => { n = Number(n || 0) * 3.75; return 'S/ ' + n.toFixed(n > 0 && n < 0.1 ? 3 : 2); };
    const porChat = hoy.respuestas_chat ? Number(hoy.costo_usd) / hoy.respuestas_chat : 0;
    const max = Math.max(0.0001, ...dias7.map((d) => Number(d.costo_usd || 0)));
    const barras = dias7.slice().reverse().map((d) => `<div title="${d.dia}: ${usd(d.costo_usd)}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;max-width:26px;height:${Math.max(3, Math.round(Number(d.costo_usd) / max * 60))}px;background:var(--ac,#F97316);border-radius:4px"></div><span class="muted" style="font-size:10.5px">${d.dia.slice(8)}</span></div>`).join('');
    const card = document.createElement('div');
    card.id = 'gasto-ia'; card.className = 'card col'; card.style.marginBottom = '14px';
    card.innerHTML = `<div class="entre"><b>🤖 Gasto del bot (Claude)</b><span class="muted" style="font-size:12px">Solo lo ves tú</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px">
        <div><div class="muted" style="font-size:12px">Hoy</div><div style="font-size:24px;font-weight:700">${usd(hoy.costo_usd)}</div><div class="muted" style="font-size:12px">${sol(hoy.costo_usd)} · ${hoy.respuestas_chat || 0} chats</div></div>
        <div><div class="muted" style="font-size:12px">Este mes</div><div style="font-size:24px;font-weight:700">${usd(sumMes)}</div><div class="muted" style="font-size:12px">${sol(sumMes)}</div></div>
        <div><div class="muted" style="font-size:12px">Proyección del mes</div><div style="font-size:24px;font-weight:700">${usd(proy)}</div><div class="muted" style="font-size:12px">según los últimos 7 días</div></div>
        <div><div class="muted" style="font-size:12px">Por chat atendido hoy</div><div style="font-size:24px;font-weight:700">${porChat ? usd(porChat) : '—'}</div><div class="muted" style="font-size:12px">${porChat ? sol(porChat) : 'sin chats hoy'}${Number(hoy.simulacion) ? ` · pruebas: ${usd(hoy.simulacion)}` : ''}</div></div>
      </div>
      ${dias7.length > 1 ? `<div style="display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:10px">${barras}</div>` : ''}`;
    cont.prepend(card);
  };
})();
</script>

<script>
/* ---------- auto-actualización: si hay versión nueva publicada, recarga sola ---------- */
const CRM_VERSION='2026-11-25-7';
async function revisarVersion() {
  try {
    const t = await fetch(location.pathname + '?nv=' + Date.now(), { cache: 'no-store' }).then((r) => r.text());
    const v = (t.match(/CRM_VERSION='([^']+)'/) || [])[1];
    if (v && v !== CRM_VERSION) { const u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.toString()); }
  } catch (_) { /* sin conexión */ }
}
setTimeout(revisarVersion, 3000);
setInterval(revisarVersion, 3 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarVersion(); });
</script>

<script>
/* =====================================================================
   ETIQUETAS (varias por chat, editables) · ETAPAS PERSONALIZADAS
